{
  "name": "company-strategic-intelligence-shadow",
  "services": {
    "intelligence-orchestrator": {
      "image": "docker.1ms.run/library/node:22.14.0-alpine3.21@sha256:9bef0ef1e268f60627da9ba7d7605e8831d5b56ad07487d24d1aa386336d1944",
      "user": "10003:10003",
      "working_dir": "/opt/company-intelligence/orchestrator",
      "command": [
        "node",
        "orchestrator.mjs",
        "--policy",
        "/etc/company-intelligence/shadow-policy.json",
        "--queue",
        "/var/lib/company-intelligence/queue"
      ],
      "environment": {
        "TZ": "Asia/Shanghai",
        "PUBLISH": "false",
        "FORMAL_P2_ENABLED": "false",
        "EMPLOYEE_DELIVERY_ENABLED": "false",
        "ERP_WRITEBACK_ENABLED": "false",
        "SOCIAL_WRITEBACK_ENABLED": "false",
        "CAUSAL_ACTIVATION_ENABLED": "false"
      },
      "volumes": [
        "./orchestrator:/opt/company-intelligence/orchestrator:ro",
        "./config/shadow-policy.json:/etc/company-intelligence/shadow-policy.json:ro",
        "${SI_STATE_ROOT:?SI_STATE_ROOT is required}/queue:/var/lib/company-intelligence/queue"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=16m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "restart": "unless-stopped",
      "cpus": 0.1,
      "mem_limit": "96m",
      "pids_limit": 64,
      "networks": [
        "scheduler"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "3"
        }
      }
    },
    "intelligence-collector": {
      "profiles": [
        "worker"
      ],
      "image": "${SI_COLLECTOR_IMAGE:?SI_COLLECTOR_IMAGE must be sha256:... or repository@sha256:...}",
      "user": "10001:10001",
      "working_dir": "/opt/company-ai-ontology/services/intelligence-collector",
      "command": [
        "run",
        "--config",
        "/etc/company-intelligence/config.json",
        "--registry",
        "/etc/company-intelligence/source-registry.json"
      ],
      "environment": {
        "TZ": "Asia/Shanghai",
        "NODE_ENV": "production",
        "PUBLISH": "false",
        "FORMAL_P2_ENABLED": "false",
        "EMPLOYEE_DELIVERY_ENABLED": "false",
        "ERP_WRITEBACK_ENABLED": "false",
        "SOCIAL_WRITEBACK_ENABLED": "false",
        "CAUSAL_ACTIVATION_ENABLED": "false"
      },
      "volumes": [
        "${SI_COLLECTOR_CONFIG_FILE:?SI_COLLECTOR_CONFIG_FILE is required}:/etc/company-intelligence/config.json:ro",
        "${SI_SOURCE_REGISTRY_FILE:?SI_SOURCE_REGISTRY_FILE is required}:/etc/company-intelligence/source-registry.json:ro",
        "${SI_STATE_ROOT:?SI_STATE_ROOT is required}/collector:/var/lib/company-intelligence/state",
        "${SI_REPORT_ROOT:?SI_REPORT_ROOT is required}:/var/lib/company-intelligence/reports"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=32m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "restart": "no",
      "cpus": 0.5,
      "mem_limit": "512m",
      "pids_limit": 128,
      "networks": [
        "egress",
        "foundation-data"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    }
  },
  "networks": {
    "scheduler": {
      "internal": true
    },
    "egress": {
      "driver": "bridge"
    },
    "foundation-data": {
      "external": true,
      "name": "${FOUNDATION_DATA_NETWORK:-company-ai-foundation_data}"
    }
  }
}
