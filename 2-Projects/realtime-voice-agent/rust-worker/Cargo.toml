[package]
name = "voice-rust-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
flate2 = "1.1.9"
futures-util = "0.3.34"
hound = "3.5.1"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
livekit = { version = "0.8.3", features = ["native-tls"] }
livekit-protocol = "0.7.12"
openssl = { version = "0.10.81", features = ["vendored"] }
ort = { version = "2.0.0-rc.13", features = ["tls-native-vendored"] }
prost = "0.12"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1"
unicode-properties = "0.1"
uuid = { version = "1.24.0", features = ["v4"] }
