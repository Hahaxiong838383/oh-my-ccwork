<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06070A">
  <meta name="color-scheme" content="dark">
  <title>暗夜剧场</title>
  <link rel="stylesheet" href="night.css">
</head>
<body>
  <main id="app" class="night-app" data-phase="idle" data-paired="false" data-active="false" data-muted="false">
    <header class="topbar">
      <div class="top-left">
        <span id="live-dot" class="live-dot" aria-hidden="true"></span>
        <button id="ota-home" class="ota-home" type="button" aria-controls="service-panel" aria-expanded="false" hidden>
          <span class="ota-home-row">
            <span class="ota-home-indicator" aria-hidden="true"></span>
            <span id="ota-home-text"></span>
          </span>
          <progress id="ota-home-progress" max="100" aria-label="更新包下载进度" hidden></progress>
        </button>
      </div>

      <div class="top-actions">
        <button id="btn-service" class="top-pill top-pill-ghost" type="button" aria-controls="service-panel" aria-expanded="false">维护</button>
        <button id="btn-forget" class="top-pill top-pill-ghost" type="button" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18.84 12.25l1.72-1.71a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M5.17 11.75l-1.71 1.71a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            <line x1="2" y1="2" x2="22" y2="22"/>
          </svg>
          <span>重配</span>
        </button>

        <button id="btn-palette" class="top-pill" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="color-popover">
          <span class="color-chip" aria-hidden="true"></span>
          <span>外观</span>
        </button>
      </div>
    </header>

    <section id="ota-card" class="ota-card" role="region" aria-labelledby="ota-card-title" hidden>
      <div class="ota-card-head">
        <span class="ota-context">应用更新</span>
        <span id="ota-card-version" class="ota-card-version"></span>
      </div>
      <div class="ota-card-main">
        <span id="ota-card-spinner" class="ota-spinner" aria-hidden="true" hidden></span>
        <div class="ota-card-copy">
          <h2 id="ota-card-title" class="ota-card-title" role="status" aria-live="polite"></h2>
          <p id="ota-card-body" class="ota-card-body"></p>
        </div>
      </div>
      <div id="ota-card-progress-wrap" class="ota-progress-wrap" hidden>
        <progress id="ota-card-progress" class="ota-bar" max="100" aria-label="应用更新进度"></progress>
        <span id="ota-card-meta" class="ota-meta"></span>
      </div>
      <ol id="ota-card-steps" class="ota-steps" aria-label="更新步骤" hidden>
        <li data-step="download">下载</li>
        <li data-step="verify">校验</li>
        <li data-step="confirm">确认</li>
        <li data-step="install">安装</li>
      </ol>
      <p id="ota-card-note" class="ota-note" hidden></p>
      <div id="ota-card-actions" class="ota-card-actions" hidden>
        <button id="ota-card-primary" class="ota-btn ota-btn-primary" type="button" hidden></button>
        <button id="ota-card-secondary" class="ota-btn ota-btn-ghost" type="button" hidden></button>
      </div>
    </section>

    <section id="service-panel" class="service-panel" aria-label="诊断与更新" hidden>
      <div class="service-heading"><strong>诊断与更新</strong><button id="service-close" type="button">关闭</button></div>
      <h2>应用更新</h2>
      <div class="ota-panel-head">
        <span id="ota-panel-spinner" class="ota-spinner" aria-hidden="true" hidden></span>
        <p id="ota-phase" class="ota-phase" role="status" aria-live="polite"></p>
      </div>
      <div id="ota-transfer" hidden><progress id="ota-progress" class="ota-bar" max="100" aria-label="下载进度"></progress><span id="ota-bytes"></span></div>
      <div id="ota-activity" class="ota-activity" hidden><progress id="ota-activity-progress" class="ota-bar" aria-label="更新处理进度"></progress><span id="ota-activity-text"></span></div>
      <p id="ota-status"></p><p id="ota-version"></p>
      <p id="ota-install-note" class="ota-note" hidden></p>
      <div class="ota-actions"><button id="ota-install" type="button" hidden>安装新版</button><button id="ota-check" type="button">检查更新</button></div>
      <h2>通话诊断</h2><p id="diag-summary"></p><button id="diag-send" type="button">同步诊断记录</button>
      <small>仅回传通话事件、时间和版本。录音、字幕和设备密钥不随日志上传。</small>
    </section>
    <section id="color-popover" class="appearance-sheet" role="dialog" aria-labelledby="btn-palette" hidden>
      <div class="appearance-heading">
        <div><h2>外观</h2><button id="wheel-back" type="button" hidden>‹ 选头像</button><p id="appearance-name" aria-live="polite"></p></div>
        <button id="appearance-done" type="button">完成</button>
      </div>
      <div class="appearance-browse"><div id="avatar-families" class="avatar-families" role="group" aria-label="头像系列"></div>
        <select id="avatar-group" aria-label="筛选材质" hidden></select>
      </div>
      <div id="avatar-grid" class="avatar-grid" role="group" aria-label="选择头像"></div>
      <div class="appearance-tools">
        <div id="appearance-expression"><label for="avatar-expression">试演表情</label><select id="avatar-expression"></select></div>
        <button id="avatar-view" type="button" aria-label="切换立体与平面头像" hidden></button>
        <span id="appearance-credit"></span>
      </div>
      <div id="color-wheel-panel" hidden>
        <div id="color-wheel" role="slider" tabindex="0" aria-label="色盘，左右调色相，上下调饱和度" aria-valuemin="0" aria-valuemax="359"><span id="wheel-marker"></span></div>
        <label class="wheel-light" for="wheel-value">明暗<input id="wheel-value" type="range" min="0" max="100" value="100"></label>
      </div>
      <div class="appearance-colors">
        <span class="color-label">配色</span>
      <div id="swatch-row" class="swatch-row">
        <button class="swatch-dot" type="button" data-color="#4F7DF3" aria-label="深海蓝"></button>
        <button class="swatch-dot" type="button" data-color="#38BDF8" aria-label="冰川青"></button>
        <button class="swatch-dot" type="button" data-color="#10B981" aria-label="翠影绿"></button>
        <button class="swatch-dot" type="button" data-color="#A855F7" aria-label="暮光紫"></button>
        <button class="swatch-dot" type="button" data-color="#EC4899" aria-label="霓虹粉"></button>
        <button class="swatch-dot" type="button" data-color="#F59E0B" aria-label="琥珀金"></button>
        <button id="color-custom" class="swatch-custom" type="button" aria-label="自定义颜色" aria-controls="color-wheel-panel" aria-expanded="false"></button>
      </div>
        <span id="color-hex" class="popover-hex"></span>
      </div>
    </section>
    <section class="stage" aria-live="polite">
      <div class="gaze-surface" aria-hidden="true"></div>
      <div id="avatar-wrap" class="avatar-wrap">
        <div id="avatar-engine" aria-hidden="true"></div>
        <canvas id="orb-canvas" role="img" aria-label="小可的语音表情"></canvas>
        <div id="avatar-tears" aria-hidden="true" hidden></div>
      </div>

      <div id="status-banner" class="status-banner" role="status" hidden>
        <span id="status-text" class="status-text"></span>
      </div>

      <div id="subtitles" class="subtitles">
        <p id="mine-wrap" class="sub-mine" hidden>
          <span class="sub-tag">主人</span>
          <span id="mine-text" class="sub-mine-text"></span>
        </p>
        <p id="reply-wrap" class="sub-reply" hidden>
          <span id="reply-text" class="sub-reply-text"></span>
          <span id="reply-cursor" class="live-cursor" aria-hidden="true" hidden></span>
        </p>
      </div>
    </section>

    <footer class="bottom-bar">
      <section id="panel-pair" class="pair-card" aria-label="设备配对">
        <form id="pair-form" class="pair-form" novalidate>
          <div class="pair-head">配对密钥</div>
          <div class="pair-row">
            <input
              id="pair-key"
              class="pair-input"
              type="password"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="done"
              placeholder="输入配对密钥"
              aria-label="配对密钥"
            >
            <button id="btn-pair" class="pair-btn" type="submit">配对</button>
          </div>
        </form>
      </section>

      <section id="panel-active" class="call-controls" aria-label="通话控制" hidden>
        <button id="btn-mute" class="call-action" type="button" aria-label="静音小可播报" aria-pressed="false" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M5.2 9H7.3L10.6 6.1Q12 5 12 6.8V17.2Q12 19 10.6 17.9L7.3 15H5.2Q4 15 4 13.8V10.2Q4 9 5.2 9Z"/>
            <g class="sound-on"><path d="M15.3 9.4A4.2 4.2 0 0 1 15.3 14.6M17.8 6.9A7.7 7.7 0 0 1 17.8 17.1"/></g>
            <path class="sound-off" d="M15.4 9.6L20.2 14.4M20.2 9.6L15.4 14.4"/>
          </svg>
        </button>
        <button id="btn-call" class="call-action" type="button" aria-label="开始通话">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path class="call-start" d="M4.2 6.2Q4.2 4.2 6.2 4.2H7.8Q9.4 4.2 9.7 5.7L10.1 7.6Q10.3 8.8 9.4 9.6L9 10Q10.1 13.9 14 15L14.4 14.6Q15.2 13.7 16.4 13.9L18.3 14.3Q19.8 14.6 19.8 16.2V17.8Q19.8 19.8 17.8 19.8C10.2 19.8 4.2 13.8 4.2 6.2Z"/>
            <path class="call-end" d="M3.4 11.4C7.6 7.8 16.4 7.8 20.6 11.4Q21.3 12.1 21.1 13.3L20.8 14.5Q20.5 15.6 19.3 15.6L17.2 15.4Q16.1 15.3 15.9 14.2L15.7 13Q12 11.8 8.3 13L8.1 14.2Q7.9 15.3 6.8 15.4L4.7 15.6Q3.5 15.6 3.2 14.5L2.9 13.3Q2.7 12.1 3.4 11.4Z"/>
          </svg>
        </button>
      </section>
    </footer>
  </main>

  <script src="livekit.js"></script>
  <script src="orb-reference.js"></script>
  <script src="orb-motion.js"></script>
  <script src="orb-surface.js"></script>
  <script src="touch-sound.js"></script>
  <script src="orb-input.js"></script>
  <script src="appearance.js"></script>
  <script src="color-wheel.js"></script>
  <script src="night.js"></script>
  <script src="session.js"></script>
</body>
</html>
