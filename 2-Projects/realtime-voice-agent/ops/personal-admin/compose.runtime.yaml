services:
  admin:
    environment:
      WORKER_STATUS_FILE: /run/worker-state/worker.json
      SPEECH_ORIGIN: http://personal-local-speech:8091
      TALK_SITE_ORIGIN: https://pa.hahaxiong.cc:8666
      PERSONAL_PROVIDERS_FILE: /run/personal-providers/providers.json
    volumes:
      - /vol1/1000/docker/personal-voice-runtime/cache/state:/run/worker-state:ro
      - /vol1/1000/docker/personal-voice-runtime/private/brain.env:/run/brain-access.env:ro
      - /vol1/1000/docker/personal-voice-runtime/private/providers:/run/personal-providers
      - /vol1/1000/docker/personal-voice-runtime/private/brain-console.key:/run/brain-console.key:ro
      - /vol1/1000/docker/personal-night-ota/data:/run/night-diagnostics:ro
      - /vol1/1000/docker/personal-night-ota/bridge:/run/night-bridge:ro
    networks:
      - default
      - voice
networks:
  voice:
    external: true
    name: personal-voice-private
