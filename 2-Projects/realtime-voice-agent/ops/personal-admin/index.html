<!doctype html>
<html lang="zh-CN" data-theme="glass"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小可 · 私人语音管理</title>
<style>
:root{color-scheme:light;--ink:#141b2d;--soft:#414e64;--accent:#4f46e5;--edge:#c5cfdf;--surface:rgba(255,255,255,.88)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.6 system-ui,sans-serif;background:radial-gradient(ellipse at 10% 0%,#d8d9fc 0,transparent 43%),radial-gradient(ellipse at 91% 18%,#cde8e5 0,transparent 47%),#eaf0f7}
header{background:var(--surface);border-bottom:1px solid var(--edge);padding:16px max(5vw,20px);display:flex;align-items:center;justify-content:space-between}
main{max-width:960px;margin:36px auto;padding:0 20px}h1{font-size:clamp(28px,4vw,36px);line-height:1.2;letter-spacing:-.03em}h2{font-size:20px;margin:0 0 14px}
section{background:var(--surface);border:1px solid var(--edge);border-radius:20px;margin:18px 0;padding:clamp(18px,3vw,30px);box-shadow:0 4px 24px #304b7010}
label{display:block;margin:10px 0}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #9aa9bc;border-radius:9px;background:#fff;color:var(--ink)}
button{padding:9px 18px;background:var(--accent);color:white;border:0;border-radius:12px;cursor:pointer;font-weight:600}button:disabled{opacity:.6}a{color:#4338a8}:focus-visible{outline:3px solid #0f766e;outline-offset:2px}
#login{max-width:460px;margin:10vh auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px}.grid div{background:#edf1fa;border:1px solid #dce2f0;border-radius:12px;padding:12px}.hint,small{color:var(--soft)}#msg{position:sticky;bottom:12px;background:#fff4cf;color:#3e3015;padding:10px;border-radius:9px}#msg:empty{display:none}[hidden]{display:none!important}
</style>
<header><strong>小可 · 私人语音管理</strong><button id="logout" hidden>退出</button></header>
<main><section id="login"><h1>管理员登录</h1><form id="signin"><label>管理员口令<input id="pass" type="password" autocomplete="current-password" required></label><button>登录</button></form></section>
<div id="panel" hidden><h1>语音工作台</h1><p><a href="/api/design" target="_blank" rel="noopener">三套设计预览</a> <small>手机、Web 对话与管理台 · 演示数据</small></p><section><h2>服务状态</h2><div class="grid" id="services"></div><small id="build"></small></section>
<section><h2>热词草稿</h2><label>词表<select id="kind"><option value="asr">语音识别</option><option value="interrupt">打断</option><option value="exit">退出</option><option value="device_asr">设备指令</option><option value="backchannel">播放中附和</option></select></label><label>每行一个词<textarea id="words" rows="4"></textarea></label><button id="saveWords">保存草稿</button> <small id="edited"></small></section>
<section><h2>衔接短语</h2><div class="grid" id="probs"></div><button id="saveProbs">保存设置</button></section><p class="hint">配置保存在飞牛。个人 worker 接入并回报加载版本后，才能核实通话实际使用的配置。</p></div><p role="status" id="msg"></p></main>
<script>
const el=id=>document.getElementById(id);let state;
function display(active){el('login').hidden=active;el('panel').hidden=!active;el('logout').hidden=!active}
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json','X-Voice-Admin':'1'},body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json();if(!r.ok){if(r.status===401)display(false);throw Error(j.error||'请求失败')}return j}
function draft(){const d=state.drafts[el('kind').value];el('words').value=d?d.words.join('\n'):'';el('edited').textContent=d?'保存于 '+new Date(d.created_at).toLocaleString():'尚无草稿'}
async function load(){state=await api('settings');display(true);draft();el('build').textContent='后台版本 '+state.build;el('services').replaceChildren();for(const [name,v] of [['管理后台','在线'],['语音 worker',state.worker],['个人大脑',state.brain],['北京签票',state.ticket]]){const d=document.createElement('div');d.append(name,document.createElement('br'),v);el('services').append(d)}el('probs').replaceChildren();for(const [k,label] of Object.entries({default:'默认',chatty:'健谈',quiet:'安静',funny:'幽默'})){const l=document.createElement('label');l.textContent=label+'（%）';const i=document.createElement('input');i.type='number';i.min=0;i.max=100;i.step='any';i.id='p-'+k;i.value=+(100*state.probabilities[k]).toFixed(4);l.append(i);el('probs').append(l)}}
function act(fn){return async e=>{e.preventDefault();el('msg').textContent='';try{await fn()}catch(err){el('msg').textContent=err.message}}}
el('signin').onsubmit=act(async()=>{await api('login','POST',{password:el('pass').value});el('pass').value='';await load()});
el('logout').onclick=act(async()=>{await api('logout','POST');location.reload()});
el('kind').onchange=draft;
el('saveWords').onclick=act(async()=>{const k=el('kind').value;state.drafts[k]=await api('drafts/'+k,'PUT',{words:el('words').value.split('\n').map(x=>x.trim()).filter(Boolean),previous:state.drafts[k]?.id??null});draft();el('msg').textContent='草稿已保存'});
el('saveProbs').onclick=act(async()=>{const probabilities={};for(const k of Object.keys(state.probabilities)){const v=el('p-'+k).valueAsNumber;if(!Number.isFinite(v)||v<0||v>100)throw Error('请填写 0 到 100 的数字');probabilities[k]=v/100}await api('probabilities','PUT',{probabilities});el('msg').textContent='设置已保存'});
load().catch(e=>{if(e.message!=='请登录')el('msg').textContent=e.message});
</script></html>
