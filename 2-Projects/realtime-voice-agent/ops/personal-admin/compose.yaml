services:
  admin:
    image: personal-voice-admin:${ADMIN_BUILD:?set ADMIN_BUILD}
    restart: unless-stopped
    user: "1000:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ADMIN_BUILD: ${ADMIN_BUILD}
      EDGE_HEALTH_URL: ${EDGE_HEALTH_URL:-}
      BRAIN_HEALTH_URL: ${BRAIN_HEALTH_URL:-}
    volumes:
      - ./data:/app/data
      - ./private:/run/private:ro
    ports:
      - "192.168.1.115:18783:8443"
