worker_processes 1;
pid /run/personal-edge-gateway/nginx.pid;
error_log stderr crit;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    client_body_temp_path /run/personal-edge-gateway/client-body;
    proxy_temp_path /run/personal-edge-gateway/proxy;
    fastcgi_temp_path /run/personal-edge-gateway/fastcgi;
    uwsgi_temp_path /run/personal-edge-gateway/uwsgi;
    scgi_temp_path /run/personal-edge-gateway/scgi;
    include /etc/nginx/mime.types;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=ticket:1m rate=5r/s;

    server {
        listen 18784 ssl default_server;
        ssl_certificate /opt/personal-edge/pki/server.crt;
        ssl_certificate_key /run/credentials/personal-edge-gateway.service/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;

        location = /api/voice/ticket {
            limit_req zone=ticket burst=15 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:18781;
        }

        location = /healthz {
            proxy_pass http://127.0.0.1:18781;
        }

        location ~ ^/(?:rtc(?:/v1)?(?:/validate)?|agent)$ {
            proxy_pass http://127.0.0.1:18780;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }

        location ~ ^/twirp/livekit[.]RoomService/(?:DeleteRoom|ListRooms)$ {
            proxy_pass http://127.0.0.1:18780;
        }

        location / {
            root /opt/personal-edge/public;
            try_files $uri $uri/ =404;
        }
    }
}
