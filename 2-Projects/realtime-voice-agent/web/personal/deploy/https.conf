limit_req_zone $binary_remote_addr zone=xiaoke_ticket:1m rate=5r/s;
server {
    listen 443 ssl;
    server_name xiaoke-voice.hahaxiong.cc;
    ssl_certificate /etc/letsencrypt/live/xiaoke-voice.hahaxiong.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaoke-voice.hahaxiong.cc/privkey.pem;
    access_log off;
    root /opt/personal-edge/client-current;
    index index.html;
    client_max_body_size 1k;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "camera=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://xiaoke-voice.hahaxiong.cc; media-src 'self' blob:; script-src 'self'; style-src 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'none'" always;
    location = /api/voice/ticket {
        limit_req zone=xiaoke_ticket burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18781;
    }
    location ~ ^/rtc(/|$) {
        proxy_pass http://127.0.0.1:18780;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
    location / { try_files $uri $uri/ =404; }
}
