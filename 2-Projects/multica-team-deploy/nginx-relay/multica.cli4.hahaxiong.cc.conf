# multica.cli4.hahaxiong.cc — Phase 4 final: WS direct routing
# 反代: HK → Mini frpc → QNAP. frontend:3080 (web :18080) + backend:8080 (api :18443)

# 80 → 443 redirect, 保留 ACME
server {
    listen 80;
    server_name multica.cli4.hahaxiong.cc;
    access_log /var/log/nginx/multica.log multica_log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name multica.cli4.hahaxiong.cc;
    access_log /var/log/nginx/multica.log multica_log;

    ssl_certificate /etc/letsencrypt/live/multica.cli4.hahaxiong.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multica.cli4.hahaxiong.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_buffering off;
    client_max_body_size 100m;

    # daemon WebSocket: 直反代 backend (绕 frontend Next.js)
    # Phase 6: 飞书 OAuth side-car (sidecar on mini :18090 via FRP :18890)
    # /settings 是 /oauth-ui 的别名 (multica web 入口可链此)
    location /settings {
        proxy_pass http://127.0.0.1:18890;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /oauth-ui {
        proxy_pass http://127.0.0.1:18890;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/feishu/ {
        proxy_pass http://127.0.0.1:18890;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 240s;
    }

    location /api/daemon/ws {
        proxy_pass http://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # daemon REST API: 直反代 backend (heartbeat / claim / etc)
    location /api/daemon/ {
        proxy_pass http://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 浏览器 WebSocket /ws (前端 Next.js rewrites)
    location /ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 默认: 所有路径反代到 frontend + 注入飞书绑定浮动按钮 (V4, 2026-05-30)
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 关 upstream gzip 让 sub_filter 能匹配 plain html
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;

        # 零侵入 multica 上游: 在 </body> 前注入飞书绑定浮动按钮
        # 浮动按钮 onclick → /settings (sidecar oauth-ui 别名, auto detect user via /api/me)
        # sub_filter 只命中 text/html, 不影响 JSON/JS/CSS/二进制
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter "</body>" '<style id="multica-feishu-fab-style">#multica-feishu-fab{position:fixed;right:18px;bottom:18px;z-index:99999;background:linear-gradient(135deg,#3370ff,#4d7dff);color:#fff;padding:10px 14px;border-radius:24px;font:600 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;box-shadow:0 6px 18px rgba(51,112,255,.35);cursor:pointer;border:none;text-decoration:none;display:inline-flex;align-items:center;gap:7px;transition:transform .15s,box-shadow .15s;letter-spacing:.2px}#multica-feishu-fab:hover{box-shadow:0 8px 22px rgba(51,112,255,.5);transform:translateY(-1px)}#multica-feishu-fab svg{width:15px;height:15px;flex-shrink:0}@media (max-width:560px){#multica-feishu-fab{right:14px;bottom:14px;padding:9px 12px;font-size:12px}}</style><a id="multica-feishu-fab" href="/settings" target="_blank" rel="noopener" title="飞书扫码绑定 / 强制重置 (V4)" aria-label="飞书绑定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3M14 17h3M14 20h3M17 14v3M20 14v3"/></svg>飞书绑定</a></body>';
    }
}
