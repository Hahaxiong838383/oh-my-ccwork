# multica.cli4.hahaxiong.cc — Phase 4 final: WS direct routing
# 反代: HK → Mini frpc → QNAP. frontend:3080 (web :18080) + backend:8080 (api :18443)

# 80 → 443 redirect, 保留 ACME
server {
    listen 80;
    server_name multica.cli4.hahaxiong.cc;
    access_log /var/log/nginx/multica.log multica_log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name multica.cli4.hahaxiong.cc;
    access_log /var/log/nginx/multica.log multica_log;

    ssl_certificate /etc/letsencrypt/live/multica.cli4.hahaxiong.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multica.cli4.hahaxiong.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_buffering off;
    client_max_body_size 100m;

    # daemon WebSocket: 直反代 backend (绕 frontend Next.js)
    # Phase 6: 飞书 OAuth side-car (sidecar on mini :18090 via FRP :18890)
    # /settings 是 /oauth-ui 的别名 (multica web 入口可链此)
    location /settings {
        proxy_pass http://127.0.0.1:18890;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /oauth-ui {
        proxy_pass http://127.0.0.1:18890;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/feishu/ {
        proxy_pass http://127.0.0.1:18890;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 240s;
    }

    location /api/daemon/ws {
        proxy_pass http://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # daemon REST API: 直反代 backend (heartbeat / claim / etc)
    location /api/daemon/ {
        proxy_pass http://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 浏览器 WebSocket /ws (前端 Next.js rewrites)
    location /ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 默认: 所有路径反代到 frontend
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
