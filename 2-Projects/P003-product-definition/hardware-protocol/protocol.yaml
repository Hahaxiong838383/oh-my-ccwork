reading_rules:
  - "本文件是转写件，不是权威源。权威源是 meta.source_url 的飞书文档；两者冲突时以飞书为准，并回来修本文件。"
  - "解析任何 command 之前，先检查它是否出现在 open_issues 的 affected 列表中。凡 status 为 unresolved / tbd / contradicted 的字段，禁止用默认值、经验值或「合理推断」补全 —— 停下来问人。"
  - "标 status: inferred 的条目是 cc 的推断而非文档明文（目前有 byte_order、frame.ack_frame.layout）。用于实现前需真机复核。"
  - "cmd_id 一律 4 位十六进制。原文 OTA 段的 3 位写法保留在 raw_cmd_id 字段，检索时两种都要试。"
  - "payload_length 指 Payload 段长度，不含 10 字节帧开销；ACK OK / ACK Error 帧没有 Payload 与 Length 字段。"
  - "文档中的图片与画板内容不在本文件内，见 non_textual_assets —— 不要因为本文件没写就断定原文档没有该信息。"
  - "CRC8 已用文档自带测试向量复算通过（0x08）；实现后应先跑 crc_reference.py 的向量再上板。"
