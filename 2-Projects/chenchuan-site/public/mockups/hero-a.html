<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 A · 暗夜极简 — Hero Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,wght@0,200..700&family=Geist+Mono:wght@300..500&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#0a0a0a;color:#f5f5f5;font-family:'Geist',sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px}
  .hero{max-width:980px;width:100%;display:flex;flex-direction:column;gap:0}

  .top-bar{display:flex;justify-content:space-between;align-items:center;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(245,245,245,0.4);padding-bottom:64px}
  .top-bar .live{display:flex;align-items:center;gap:8px}
  .live-dot{width:5px;height:5px;background:#f5f5f5;border-radius:50%;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}

  .name{font-family:'Instrument Serif',serif;font-size:clamp(80px,14vw,180px);font-weight:400;letter-spacing:-0.03em;line-height:0.9;color:#fafafa}
  .name-en{font-family:'Geist Mono',monospace;font-size:13px;letter-spacing:0.35em;text-transform:uppercase;color:rgba(245,245,245,0.5);margin-top:24px}

  .divider{height:1px;background:rgba(245,245,245,0.1);margin:64px 0 56px}

  .quote{font-family:'Newsreader',serif;font-size:clamp(20px,2.4vw,28px);line-height:1.5;color:rgba(245,245,245,0.85);max-width:680px;font-weight:300}
  .quote em{font-style:italic;color:#f5f5f5}

  .meta-row{display:flex;gap:48px;flex-wrap:wrap;margin-top:48px;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(245,245,245,0.55)}
  .meta-row strong{color:#f5f5f5;font-weight:500;margin-right:8px}

  .actions{display:flex;gap:48px;margin-top:80px;flex-wrap:wrap}
  .action{display:flex;align-items:baseline;gap:14px;text-decoration:none;color:inherit;border-bottom:1px solid rgba(245,245,245,0.15);padding-bottom:8px;transition:all 0.4s cubic-bezier(0.16,1,0.3,1)}
  .action:hover{border-bottom-color:#f5f5f5}
  .action .num{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:0.2em;color:rgba(245,245,245,0.45)}
  .action .label{font-family:'Geist',sans-serif;font-size:16px;font-weight:400;color:#f5f5f5}
  .action .arr{font-family:'Geist Mono',monospace;font-size:13px;color:rgba(245,245,245,0.55);transition:transform 0.3s}
  .action:hover .arr{transform:translateX(4px);color:#f5f5f5}

  .footer{margin-top:80px;display:flex;justify-content:space-between;align-items:center;padding-top:32px;border-top:1px solid rgba(245,245,245,0.08);font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(245,245,245,0.35)}

  .back{position:fixed;top:24px;left:24px;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(245,245,245,0.4);text-decoration:none;border:1px solid rgba(245,245,245,0.12);padding:6px 12px}
  .back:hover{color:#f5f5f5;border-color:#f5f5f5}
</style>
</head>
<body>
<a class="back" href="./index.html">← 返回对比</a>

<div class="hero">
  <div class="top-bar">
    <span>方案 A · 暗夜极简</span>
    <span class="live"><span class="live-dot"></span>Product Director · Futurus</span>
  </div>

  <h1 class="name">陈川</h1>
  <div class="name-en">Chen Chuan / Product × AI × Systems</div>

  <div class="divider"></div>

  <p class="quote">
    19 年硬科技产品经验。把智能转化为<em>产品力</em>，把空间光学、AI 交互、数据服务压缩成可验证、可交付、可增长的系统。
  </p>

  <div class="meta-row">
    <span><strong>19</strong>年硬科技</span>
    <span><strong>46</strong>项专利</span>
    <span><strong>9</strong>款量产产品</span>
  </div>

  <div class="actions">
    <a class="action" href="#">
      <span class="num">01</span>
      <span class="label">查看作品</span>
      <span class="arr">→</span>
    </a>
    <a class="action" href="#">
      <span class="num">02</span>
      <span class="label">和我的 AI 聊聊</span>
      <span class="arr">→</span>
    </a>
    <a class="action" href="#">
      <span class="num">03</span>
      <span class="label">联系我</span>
      <span class="arr">→</span>
    </a>
  </div>

  <div class="footer">
    <span>my.chenchuan.cc · 2026</span>
    <span>↓ 滑下探索</span>
  </div>
</div>
</body>
</html>
