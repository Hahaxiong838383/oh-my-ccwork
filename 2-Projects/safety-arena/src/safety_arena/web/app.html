<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>safety-arena · 安全架构白盒对比</title>
<style>
  :root{
    --bg:#f6f6f4; --card:#fff; --ink:#1b1b1a; --muted:#6b6b66; --line:#e6e6e1;
    --teal:#1D9E75; --teal-bg:#e1f5ee; --red:#E24B4A; --red-bg:#fceaea;
    --amber:#EF9F27; --amber-bg:#faeeda; --blue:#185fa5; --blue-bg:#e6f1fb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
  header h1{font-size:22px;margin:0 0 4px;font-weight:600}
  header p{margin:0 0 20px;color:var(--muted);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
  .card h2{font-size:15px;margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .card h2 .hint{font-weight:400;color:var(--muted);font-size:12px}
  .row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.grow{flex:1;min-width:300px}
  .field label{font-size:12px;color:var(--muted)}
  .note{font-size:12px;color:var(--muted)}
  select,button,textarea{font:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;padding:8px 12px}
  select{min-width:240px}
  textarea{width:100%;resize:vertical;padding:8px 10px}
  button{cursor:pointer;background:var(--ink);color:#fff;border-color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap}
  button.ghost{background:#fff;color:var(--ink)}
  button:hover{opacity:.88}
  input[type=range]{accent-color:var(--teal)}
  input[type=file]{font-size:13px}
  .rngval{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
  hr{border:none;border-top:1px solid var(--line);margin:14px 0}
  /* strategy card with left mechanism / right timeline split */
  #tl-input{margin-bottom:12px;min-height:18px}
  .strat{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fafaf8}
  .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:780px){.sgrid{grid-template-columns:1fr}}
  .mech{border-right:1px solid var(--line);padding-right:16px}
  @media(max-width:780px){.mech{border-right:none;border-bottom:1px solid var(--line);padding-right:0;padding-bottom:12px}}
  .mhead{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
  .mhead b{font-size:14px}
  .mhead .meta{margin-left:auto;font-size:12px}
  .mrule{font-size:12px;color:var(--muted);line-height:1.65;margin-bottom:10px}
  .mparams{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
  .pr{display:flex;align-items:center;gap:8px;font-size:12px}
  .pr input[type=range]{width:120px}
  .mlog-title{font-size:11px;color:var(--muted);margin-bottom:3px}
  .mlog{font-size:11px;font-variant-numeric:tabular-nums;max-height:130px;overflow:auto;
    border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
  .mlog:empty::after{content:"（播放后显示信号与决策）";color:var(--muted)}
  .ld{padding:2px 0}
  .ld+.ld{border-top:1px dashed var(--line)}
  .ld.sig{color:var(--blue)}
  .ld.cancel{color:#a32d2d;font-weight:600}
  .ld.truncate{color:#854f0b;font-weight:600}
  .ld.pass{color:#0f6e56}
  .tlcol .stream{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:34px;
    padding:8px;border:1px dashed var(--line);border-radius:8px;background:#fff}
  .tlcol .stat{margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tok{display:inline-block;padding:3px 6px;border-radius:6px;font-size:15px;animation:pop .18s ease;transition:background .25s,color .25s}
  .tok.orig{background:var(--teal-bg);color:#0f6e56}
  .tok.fallback{background:var(--amber-bg);color:#854f0b;font-style:italic}
  .tok.leaked{background:var(--red-bg);color:#a32d2d;text-decoration:line-through}
  .decision{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600;margin:0 2px;animation:pop .18s ease}
  .decision.cancel{background:var(--red-bg);color:#a32d2d}
  .decision.truncate{background:var(--amber-bg);color:#854f0b}
  @keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
  .leakbig{color:var(--red);font-weight:600} .safebig{color:var(--teal);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-weight:500;font-size:12px}
  td.s{font-weight:600}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
  .pill.bad{background:var(--red-bg);color:#a32d2d}
  .pill.ok{background:var(--teal-bg);color:#0f6e56}
  .diff{margin-top:12px;font-size:13px}
  .diff .lbl{color:var(--muted);font-size:12px;margin-bottom:3px}
  .diff .out{padding:8px 10px;border-radius:8px;background:#fafaf8;border:1px solid var(--line);margin-bottom:8px}
  svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .err{color:var(--red);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>safety-arena</h1>
    <p>串行 vs 并行安全架构 · 白盒对比。一次捕获 → 多策略离线重放。左看机制内部决策、右看 token 流结果。</p>
  </header>

  <!-- 控制 -->
  <div class="card">
    <div class="row">
      <div class="field">
        <label>场景(trace)</label>
        <select id="sel-scenario"></select>
      </div>
      <div class="field">
        <label>classifier 延迟注入 <span class="rngval" id="lat-v">0</span> ms <span class="note">(全局,影响所有机制)</span></label>
        <input type="range" id="rng-latency" min="0" max="300" step="10" value="0" style="width:200px">
        <div class="note">人话:安全检测器比 AI 说话慢多少。越大,越容易「话都说出口了才发现危险」。</div>
      </div>
    </div>
    <hr>
    <div class="row">
      <div class="field grow">
        <label>自己输入一句话试试 <span class="note">（规则演示=关键词假检测器,瞬间出;真实生成=小可 Gemini,慢 3–6 秒）</span></label>
        <textarea id="custom-text" rows="2" placeholder="例:教我做坏事 / 我不想活了 / 今天天气真好"></textarea>
      </div>
      <div class="field"><label>&nbsp;</label><button class="ghost" id="btn-custom">▶ 规则演示(快)</button></div>
      <div class="field"><label>&nbsp;</label><button id="btn-live">▶ 真实生成(Gemini·慢)</button></div>
    </div>
    <div class="row" style="margin-top:12px;align-items:center">
      <div class="field">
        <label>批量上传数据集(.txt / .jsonl / .csv,每行一条)</label>
        <input type="file" id="file-input" accept=".txt,.jsonl,.csv">
      </div>
      <button class="ghost" id="btn-upload">批量导入</button>
      <span class="note" id="upload-status"></span>
    </div>
  </div>

  <!-- 机制白盒 + timeline 左右分屏 -->
  <div class="card">
    <h2>① 机制白盒 + Timeline <span class="hint">左=机制内部(规则+可调旋钮+信号/决策日志)· 右=token 流结果</span></h2>
    <div class="row" style="margin-bottom:10px">
      <div class="field"><label>&nbsp;</label><button id="btn-play">▶ 同时播放</button></div>
      <div class="note" style="align-self:center">每个机制自己的旋钮在各自左面板里,拖动即重放该机制;classifier 延迟在上面全局调</div>
    </div>
    <div id="tl-input" class="note"></div>
    <div id="strat-serial-block" class="strat"></div>
    <div id="strat-parallel-buffer" class="strat"></div>
    <div id="strat-arbiter" class="strat"></div>
  </div>

  <!-- compare -->
  <div class="card">
    <h2>② 四策略指标对比 <span class="hint">同一条 trace,同一注入延迟</span> <button class="ghost" id="btn-compare" style="margin-left:auto">运行对比</button></h2>
    <table id="cmp-table"></table><div class="diff" id="cmp-diff"></div>
  </div>

  <!-- curve -->
  <div class="card">
    <h2>③ buffer 深度 ↔ 泄漏 / TTFT <span class="hint">权衡曲线就是结论本身</span> <button class="ghost" id="btn-scan" style="margin-left:auto">扫描</button></h2>
    <div id="curve-wrap"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const scenario = () => $('#sel-scenario').value;
const latency  = () => +$('#rng-latency').value;
$('#rng-latency').oninput = e => { $('#lat-v').textContent = e.target.value; };

const STRATS = [
  {key:'serial-block', name:'串行阻断',
   rule:'classifier 判定完成后才决定:安全→放行全部 / 危险→取消并兜底。必须等「判定 AND 生成」都完成,所以开口最慢、但零泄漏。',
   params:[]},
  {key:'parallel-buffer', name:'并行 + 缓冲',
   rule:'token 边生成边流式输出,缓冲最近 k 个字等检测;出现 high 信号 → 取消(缓冲里没放行的丢弃,已放行的算泄漏)。k 越大越不漏、但开口越慢。',
   params:[{id:'k', label:'缓冲深度 k', min:0, max:8, val:0}]},
  {key:'arbiter', name:'实时分级仲裁',
   rule:'每个字放行时查当前风险:high→取消兜底 / medium→截断(保留已出) / low→放行。带反应缓冲 k 给信号一点反应窗口。',
   params:[{id:'k', label:'反应缓冲 k', min:0, max:8, val:0}]},
];
function pval(s, id){ const p = s.params.find(x => x.id === id); return p ? p.val : 0; }
function specOf(s){
  if(s.key === 'serial-block') return 'serial-block';
  if(s.key === 'parallel-buffer') return 'parallel-buffer:' + pval(s, 'k');
  return 'arbiter:' + pval(s, 'k');
}
function renderStrat(s){
  const box = $('#strat-' + s.key);
  const params = s.params.length
    ? s.params.map(p => `<div class="pr"><span>${p.label}</span>`
        + `<input type="range" min="${p.min}" max="${p.max}" value="${p.val}" data-pid="${p.id}">`
        + `<span class="rngval" id="pv-${s.key}-${p.id}">${p.val}</span></div>`).join('')
    : '<div class="note">机制本身不带旋钮(只受全局 classifier 延迟影响)</div>';
  box.innerHTML = `<div class="sgrid">
    <div class="mech">
      <div class="mhead"><b>${s.name}</b><span class="meta"></span></div>
      <div class="mrule">${s.rule}</div>
      <div class="mparams">${params}</div>
      <div class="mlog-title">信号 / 决策日志(白盒)</div>
      <div class="mlog"></div>
    </div>
    <div class="tlcol"><div class="stream"></div><div class="stat"></div></div>
  </div>`;
  box.querySelectorAll('input[type=range]').forEach(r => {
    r.oninput = e => {
      const p = s.params.find(x => x.id === e.target.dataset.pid);
      p.val = +e.target.value;
      $('#pv-' + s.key + '-' + p.id).textContent = p.val;
      playOne(s);  // 调参即重放该机制
    };
  });
}

let esList = [];
function playAll(){ esList.forEach(e => e.close()); esList = []; $('#tl-input').textContent = ''; STRATS.forEach(playOne); }
function playOne(s){
  const box = $('#strat-' + s.key);
  const stream = box.querySelector('.stream'); stream.innerHTML = '';
  const log = box.querySelector('.mlog'); log.innerHTML = '';
  box.querySelector('.stat').innerHTML = ''; box.querySelector('.meta').textContent = '…';
  const origs = [];
  const url = `/api/replay/stream?trace_id=${enc(scenario())}&strategy=${enc(specOf(s))}`
            + `&classifier_latency_ms=${latency()}&speed=5`;
  const es = new EventSource(url); esList.push(es);
  function logLine(cls, text){ const d = document.createElement('div'); d.className = 'ld ' + cls; d.textContent = text; log.appendChild(d); }
  es.addEventListener('meta', e => {
    const d = JSON.parse(e.data);
    box.querySelector('.meta').innerHTML = d.harmful ? '<span style="color:var(--red)">危险样本</span>' : '<span style="color:var(--teal)">安全样本</span>';
    (d.signals || []).forEach(sg => logLine('sig', `${Math.round(sg.t_ms)}ms  ${sg.source || '检测器'} → ${sg.label}${sg.risk != null ? ' risk ' + sg.risk : ''}　← ${sg.reason || '(无理由)'}`));
    if(s.key === 'serial-block') $('#tl-input').innerHTML = `输入:<b>${esc(d.input)}</b>`;
  });
  es.addEventListener('emit', e => {
    const d = JSON.parse(e.data);
    const sp = document.createElement('span'); sp.className = 'tok ' + (d.original ? 'orig' : 'fallback'); sp.textContent = d.text;
    stream.appendChild(sp); if(d.original) origs.push(sp);
  });
  es.addEventListener('decision', e => {
    const d = JSON.parse(e.data);
    const m = document.createElement('span'); m.className = 'decision ' + d.action; m.textContent = `⚠ ${d.risk_label || ''}→${d.action}`; stream.appendChild(m);
    if(d.action === 'cancel') origs.forEach(x => x.classList.add('leaked'));
    logLine(d.action, `${Math.round(d.t_ms)}ms  ${d.action.toUpperCase()}${d.risk_label ? ' · ' + d.risk_label : ''} · ${d.reason || ''}`);
  });
  es.addEventListener('done', e => {
    const d = JSON.parse(e.data); es.close();
    box.querySelector('.stat').innerHTML =
      `<span class="${d.leaked_tokens > 0 ? 'leakbig' : 'safebig'}">泄漏 ${d.leaked_tokens} 字</span>`
      + ` · TTFT ${Math.round(d.ttft_ms ?? 0)}ms · 首个安全 ${Math.round(d.first_safe_token_ms ?? 0)}ms · 总 ${Math.round(d.total_ms ?? 0)}ms`;
  });
  es.onerror = () => { box.querySelector('.meta').innerHTML = '<span class="err">中断</span>'; es.close(); };
}

async function loadScenarios(keep){
  const r = await fetch('/api/traces').then(r => r.json());
  const sel = $('#sel-scenario'); const cur = keep || sel.value; sel.innerHTML = '';
  for(const t of r.traces){
    const o = document.createElement('option');
    o.value = t.trace_id; o.textContent = `${t.input_text}  ·  ${t.harmful ? '危险' : '安全'} (${t.n_tokens} 字)`;
    sel.appendChild(o);
  }
  if(cur && [...sel.options].some(o => o.value === cur)) sel.value = cur;
  else { const h = r.traces.find(t => t.trace_id.startsWith('harm-early')); if(h) sel.value = h.trace_id; }
}

async function runCompare(){
  const body = { trace_id: scenario(), knobs: { classifier_latency_ms: latency() } };
  const d = await fetch('/api/replay', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)}).then(r => r.json());
  const m = d.metrics;
  let h = '<tr><th>策略</th><th>泄漏率</th><th>均泄漏</th><th>TTFT p50</th><th>首安全 p50</th><th>干预率</th></tr>';
  for(const k of Object.keys(m)){
    const x = m[k];
    const pill = x.leakage_rate > 0 ? `<span class="pill bad">${Math.round(x.leakage_rate*100)}%</span>` : '<span class="pill ok">0%</span>';
    h += `<tr><td class="s">${k}</td><td>${pill}</td><td>${x.mean_leaked_tokens.toFixed(1)}</td>`
       + `<td>${fmt(x.ttft.p50)}</td><td>${fmt(x.first_safe.p50)}</td><td>${Math.round(x.intervention_rate*100)}%</td></tr>`;
  }
  $('#cmp-table').innerHTML = h;
  let dh = '';
  for(const r of d.results){
    const safe = r.leaked_tokens === 0;
    dh += `<div class="lbl">${r.strategy} · ${safe ? '<span style="color:var(--teal)">零泄漏</span>' : '<span style="color:var(--red)">泄漏 ' + r.leaked_tokens + ' 字</span>'}</div>`
        + `<div class="out">${esc(r.emitted_text) || '<i>（无输出）</i>'}</div>`;
  }
  $('#cmp-diff').innerHTML = dh;
}

async function runScan(){
  const body = { trace_id: scenario(), knob:'buffer', values:[0,1,2,3,4,5,6,8] };
  const d = await fetch('/api/scan', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)}).then(r => r.json());
  $('#curve-wrap').innerHTML = drawCurve(d.points);
}
function drawCurve(pts){
  const W=680,H=240,P=42;
  const xs=pts.map(p=>p.x), leak=pts.map(p=>p.leaked_tokens), ttft=pts.map(p=>p.ttft_ms);
  const xmax=Math.max(...xs,1), lmax=Math.max(1,...leak), tmax=Math.max(1,...ttft);
  const X=v=>P+v/xmax*(W-2*P), YL=v=>H-P-v/lmax*(H-2*P), YT=v=>H-P-v/tmax*(H-2*P);
  const path=(ys,Y)=>pts.map((p,i)=>(i?'L':'M')+X(xs[i])+' '+Y(ys[i])).join(' ');
  const dots=(ys,Y,c)=>pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="3.5" fill="${c}"/>`).join('');
  const xlab=xs.map(v=>`<text x="${X(v)}" y="${H-P+18}" font-size="11" fill="#6b6b66" text-anchor="middle">${v}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#e6e6e1"/>
    <line x1="${P}" y1="${P}" x2="${P}" y2="${H-P}" stroke="#e6e6e1"/>
    <text x="${P}" y="${P-12}" font-size="11" fill="#6b6b66">泄漏/延迟</text>
    <text x="${W/2}" y="${H-8}" font-size="11" fill="#6b6b66" text-anchor="middle">buffer 深度 k</text>
    <path d="${path(ttft,YT)}" fill="none" stroke="#378ADD" stroke-width="2"/>
    <path d="${path(leak,YL)}" fill="none" stroke="#E24B4A" stroke-width="2"/>
    ${dots(ttft,YT,'#378ADD')}${dots(leak,YL,'#E24B4A')}${xlab}
  </svg>
  <div class="legend"><span><i style="background:#E24B4A"></i>泄漏 字数(越深越少)</span><span><i style="background:#378ADD"></i>TTFT ms(越深越慢)</span></div>`;
}

async function captureText(text){
  return fetch('/api/capture-text', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({text})}).then(r => r.json());
}
async function customSubmit(){
  const text = $('#custom-text').value.trim();
  if(!text){ $('#upload-status').textContent = '请先输入文本'; return; }
  $('#upload-status').textContent = '生成中…';
  const d = await captureText(text);
  await loadScenarios(d.trace_id);
  $('#upload-status').textContent = `已生成:${d.harmful ? '判定危险' : '判定安全'}(${d.n_tokens} 字)`;
  await Promise.all([runCompare(), runScan()]); playAll();
}
async function captureLive(){
  const text = $('#custom-text').value.trim();
  if(!text){ $('#upload-status').textContent = '请先输入文本'; return; }
  $('#btn-live').disabled = true;
  $('#upload-status').textContent = '真实 Gemini 生成中(thinking 模型较慢,约 3–6 秒)…';
  try{
    const r = await fetch('/api/capture-live', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({text})});
    if(!r.ok){ const e = await r.json().catch(() => ({})); throw new Error(e.detail || ('HTTP ' + r.status)); }
    const d = await r.json();
    await loadScenarios(d.trace_id);
    $('#upload-status').innerHTML = `真实生成完成:${d.harmful ? '<span style="color:var(--red)">判定危险</span>' : '<span style="color:var(--teal)">判定安全</span>'} · ${d.n_tokens} 字 · <code>${esc(d.sut)}</code><br><span style="color:var(--muted)">生成:</span>${esc(d.generated || '')}`;
    await Promise.all([runCompare(), runScan()]); playAll();
  }catch(err){
    $('#upload-status').innerHTML = `<span class="err">真实生成失败:${esc('' + (err.message || err))}</span>`;
  }finally{ $('#btn-live').disabled = false; }
}
function parseDataset(content){
  return content.split(/\r?\n/).map(s => s.trim()).filter(Boolean).map(line => {
    try{ const o = JSON.parse(line); return '' + (o.text ?? o.input ?? line); }
    catch{ return line.split(',')[0].replace(/^["']+|["']+$/g, ''); }
  }).filter(Boolean);
}
async function uploadFile(){
  const f = $('#file-input').files[0];
  if(!f){ $('#upload-status').textContent = '请先选文件'; return; }
  const texts = parseDataset(await f.text());
  if(!texts.length){ $('#upload-status').textContent = '没解析到内容'; return; }
  let n = 0, last = null;
  for(const t of texts){ const d = await captureText(t); last = d.trace_id; n++; $('#upload-status').textContent = `导入中 ${n}/${texts.length}…`; }
  await loadScenarios(last);
  $('#upload-status').textContent = `已导入 ${n} 条 · 在场景下拉里切换查看`;
  await Promise.all([runCompare(), runScan()]);
}

function fmt(v){ return v == null ? '–' : Math.round(v); }
function esc(s){ return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

$('#sel-scenario').onchange = () => { runCompare(); runScan(); };
$('#btn-play').onclick = playAll;
$('#btn-compare').onclick = runCompare;
$('#btn-scan').onclick = runScan;
$('#btn-custom').onclick = customSubmit;
$('#btn-live').onclick = captureLive;
$('#btn-upload').onclick = uploadFile;

(async function init(){
  STRATS.forEach(renderStrat);
  await loadScenarios();
  await Promise.all([runCompare(), runScan()]);
})();
</script>
</body>
</html>
