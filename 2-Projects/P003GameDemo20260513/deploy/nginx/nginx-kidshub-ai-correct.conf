server {
    listen 80;
    server_name kidshub-ai.hahaxiong.cc;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name kidshub-ai.hahaxiong.cc;

    ssl_certificate /etc/letsencrypt/live/kidshub-ai.hahaxiong.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kidshub-ai.hahaxiong.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    root /opt/p003/web/dist;
    index index.html;

    location ^~ /admin/vendor/ { expires 7d; access_log off; try_files $uri =404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/access.log;
}
