# KidsHub-AI 小可 Prompt 体验工作台 - kidshub-ai.hahaxiong.cc
# 与 p003.hahaxiong.cc 共用 /opt/p003 部署（同 dist 按域名分流 + 同 3001 后端）

server {
    listen 80;
    listen [::]:80;
    server_name kidshub-ai.hahaxiong.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kidshub-ai.hahaxiong.cc;

    ssl_certificate /etc/letsencrypt/live/kidshub-ai.hahaxiong.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kidshub-ai.hahaxiong.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/p003/web/dist;
    index index.html;

    access_log /var/log/nginx/kidshub-ai-access.log;
    error_log /var/log/nginx/kidshub-ai-error.log;

    client_max_body_size 2M;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /ws/voice {
        proxy_pass http://127.0.0.1:3001/ws/voice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location ~* \.(mp4|webm|png|jpg|webp|woff2|mp3)$ {
        expires 30d;
        access_log off;
    }

    # 后台原型子站（/admin）：静态直出，绕过 SPA fallback；
    # index 不缓存防旧版，vendor 大文件长缓存
    location = /admin { return 301 /admin/; }
    location ^~ /admin/vendor/ { expires 7d; access_log off; try_files \$uri =404; }
    location ^~ /admin/ {
        add_header Cache-Control "no-cache";
        try_files \$uri \$uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
