<main><div class="preview-note"><b>交互预览 · 不连接生产服务</b><span>C 机数字引用 11 月 16 日历史快照；账号、手机号及其他设备均为示例</span></div><div id="view"></div><div class="preview-footer"><span>小程序 Dashboard · 设计稿 01 / 2026.11.17</span><span>预览可搜索、查看详情、切换数据标签、模拟解绑；刷新页面可复原</span></div></main></div></div>

<script>
const devices=[{key:'c',name:'C 机',sn:'BJP00326081002000031',publicId:'dev_50b5415662259045',account:'demo_parent_C',phone:'13800000031',openid:null,bound:true,mode:'snapshot',history:186,records:0,last:'2026-11-16 23:16',version:'371_mini_008'},{key:'demo',name:'联调示例设备',sn:'DEMO-P003-0002',publicId:'dev_demo_0002',account:'demo_parent_002',phone:'13900000002',openid:null,bound:true,mode:'sample',history:24,records:12,last:'2026-11-17 09:30',version:'示例版本'},{key:'empty',name:'未绑定示例设备',sn:'DEMO-P003-0003',publicId:'dev_demo_0003',account:null,phone:null,openid:null,bound:false,mode:'empty',history:0,records:0,last:null,version:'未读取'}];
let selected=null,tab='overview',query='',filter='all',showPhone=false,historyPage=1,lastFocus=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const masked=p=>p?p.slice(0,3)+'****'+p.slice(-4):'—';const tag=(text,color='')=>`<span class="badge ${color}">${text}</span>`;function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function list(){selected=null;tab='overview';$('view').innerHTML=`<div class="head"><div><div class="eyebrow">MINIAPP · DEVICE WORKSPACE</div><h1>小程序 Dashboard</h1><p class="sub">从设备绑定到家长可见数据，在这里完成核对。</p></div><button class="btn" onclick="refresh()">↻ 刷新列表</button></div><div class="countbar"><div class="count"><div class="label">设备总数 · 预览样本</div><b>3</b><small>台</small></div><div class="count"><div class="label">已绑定小程序账号</div><b>${devices.filter(d=>d.bound).length}</b><small>台</small></div><div class="count"><div class="label">已开通 Brain · 示例</div><b>2</b><small>台</small></div><div class="count"><div class="label">未绑定</div><b>${devices.filter(d=>!d.bound).length}</b><small>台</small></div></div><section class="panel"><div class="panel-head"><h2>设备与账号</h2><span class="sub">按设备查看 · 一台设备一行</span></div><div class="filters"><label class="search"><span>⌕</span><input id="search" aria-label="搜索设备与账号" placeholder="搜索 SN / 设备 ID / 小程序账号 ID / 手机号" value="${esc(query)}" oninput="query=this.value;renderRows()"></label><select aria-label="绑定状态" onchange="filter=this.value;renderRows()"><option value="all">全部绑定状态</option><option value="bound" ${filter==='bound'?'selected':''}>已绑定</option><option value="unbound" ${filter==='unbound'?'selected':''}>未绑定</option></select><span class="sub" style="margin-left:auto">手机号默认脱敏</span></div><div class="table-wrap"><table><thead><tr><th>设备 / 序列号 SN</th><th>小程序账号 ID / 设备 ID</th><th>家长手机号</th><th>绑定状态</th><th>数据概况</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="table-foot"><span id="resultCount"></span><span>每页 20 条 <span class="page-num">1</span></span></div></section><div class="note blue"><span class="symbol">i</span><div><strong>和小程序看到的一致</strong><p>详情按当前家长绑定读取：缺测显示“暂无数据”，未知资产不写成 0；历史数据注明覆盖范围。</p></div></div><p class="quiet-foot">小程序账号 ID 使用后台统一 account_id；设备 public_id 单独列出。当前未保存微信 OpenID，详情中明确标为“未接入”。</p>`;renderRows()}
function renderRows(){const rows=devices.filter(d=>(filter==='all'||(filter==='bound'?d.bound:!d.bound))&&[d.name,d.sn,d.publicId,d.bound?d.account:'',d.bound?d.phone:''].join(' ').toLowerCase().includes(query.toLowerCase()));$('rows').innerHTML=rows.length?rows.map(d=>`<tr class="device-row"><td><button class="textbtn device-name" onclick="openDevice('${d.key}')"><span class="device-icon" aria-hidden="true">▣</span>${d.name}</button><div class="mono">${d.sn}</div></td><td><div>${d.bound?esc(d.account):'—'}</div><div class="mono">${d.publicId}</div></td><td>${d.bound?masked(d.phone):'—'}<div class="sub" style="font-size:10px">${d.bound?'示例手机号':'等待绑定'}</div></td><td>${tag(d.bound?'已绑定':'未绑定',d.bound?'green':'')}</td><td>${d.bound?(d.mode==='snapshot'?tag('时长缺测','amber')+'<div class="sub" style="font-size:10px;margin-top:5px">历史 186 条 · 流水 0 条</div>':tag('数据已同步 · 示例','blue')+'<div class="sub" style="font-size:10px;margin-top:5px">历史 24 条 · 流水可查询</div>'):'无家长可见范围'}</td><td><div class="actions"><button class="textbtn" onclick="openDevice('${d.key}')">查看详情 ↗</button>${d.bound?`<button class="textbtn red" onclick="confirmUnbind('${d.key}')">解绑</button>`:''}</div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">未找到匹配的设备</td></tr>';$('resultCount').textContent=`共 ${rows.length} 台设备 · 当前为预览样本`}
function openDevice(k){selected=devices.find(d=>d.key===k);tab='overview';showPhone=false;historyPage=1;renderDetail();window.scrollTo(0,0)}
function refresh(){toast('预览已刷新；未请求生产数据');if(selected)renderDetail();else renderRows()}
const tabs=[['overview','数据总览'],['usage','使用时长'],['assets','资产与收益'],['records','业务流水'],['history','历史对话'],['identity','身份与接入']];
function setTab(t){tab=t;renderDetail()}
function renderDetail(){const d=selected;$('view').innerHTML=`<button class="back" onclick="list()">← 返回设备列表</button><div class="head"><div><div class="eyebrow">DEVICE / ${d.mode==='snapshot'?'历史核查快照':'交互示例'}</div><h1>${d.name} <span style="vertical-align:middle">${tag(d.bound?'已绑定':'未绑定',d.bound?'green':'')}</span></h1><p class="sub">${d.mode==='snapshot'?'数据快照：2026-11-16 23:16 · 不是当前实时状态':'以下为虚构示例，用于预览正常数据与空状态'}</p></div><div class="actions"><button class="btn" onclick="refresh()">↻ 刷新数据</button>${d.bound?`<button class="btn danger" onclick="confirmUnbind('${d.key}')">解除小程序绑定</button>`:''}</div></div><section class="identity"><div><label>设备序列号 SN</label><div class="mono">${d.sn}</div></div><div><label>小程序设备 ID · public_id</label><div class="mono">${d.publicId}</div></div><div><label>小程序账号 ID · account_id</label><div class="val">${d.bound?d.account:'未绑定'}</div></div><div><label>家长手机号</label><div class="val">${d.bound?masked(d.phone):'—'} ${d.bound?tag('示例'):''}</div></div></section>${d.bound?`<div class="tabs" role="tablist" aria-label="设备数据"><!-- tab panels share the same current binding -->${tabs.map(([k,v])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" onclick="setTab('${k}')">${v}</button>`).join('')}</div><div id="tab-content">${body(d)}</div>`:`<section class="panel alert-empty"><span class="badge">当前无绑定家长</span><h2>暂无小程序可见数据</h2><p class="sub">设备与原始数据保留；旧家长的详情已从本视图清除。</p><p class="sub">重新绑定后，对话与 Ark 历史须重新授权；用时按 SN 汇总。</p><button class="btn v-gap" onclick="list()">返回设备列表</button></section>`}`}
function stat(l,v,h,missing=false,unit=''){return `<div class="stat"><div class="label">${l}</div><div class="value ${missing?'missing':''}">${v} <span class="unit">${unit}</span></div><div class="hint">${h}</div></div>`}
function empty(title,desc){return `<div class="empty"><span class="empty-icon">≋</span><b>${title}</b><p>${desc}</p></div>`}
function kv(k,v){return `<div class="kv"><span>${k}</span><b>${v}</b></div>`}
function chart(sample){const vals=sample?[32,45,28,60,40,54,36]:[null,null,null,null,null,null,null];return `<div class="chart">${vals.map((v,i)=>`<div class="bar"><b>${v??'—'}</b><i style="height:${v===null?2:v*1.55}px"></i><span>11.${sample?11+i:10+i}</span></div>`).join('')}</div><p class="sub" style="margin:15px 12px 3px;font-size:11px">${sample?'单位：分钟 · 示例已上报片段汇总':'— 表示未采集到有效使用片段，不是 0 分钟'}</p>`}
function body(d){const sample=d.mode==='sample';if(tab==='overview')return `${!sample?`<div class="note"><span class="symbol">!</span><div><strong>历史对话已可读，使用时长与新增流水仍待设备验证</strong><p>该历史快照中，C 最近自报 mini008；上传配置已开，但未采集到 focus_segment，业务流水尚未同步。</p></div></div>`:''}<div class="stats">${stat('今日有效使用',sample?'36':'暂无数据',sample?'已上报 focus_segment · 示例':'未采集到有效片段',!sample,sample?'分钟':'')}${stat('近 7 日有效使用',sample?'295':'暂无数据',sample?'覆盖 7 天 · 示例':'近 7 日无有效时长',!sample,sample?'分钟':'')}${stat('已同步历史对话',d.history,'消息条数，不等于对话轮次',false,'条')}${stat('业务流水',sample?'可查询':'暂无记录',sample?'原生 / 兼容格式 · 不推定总数':'当前历史快照中无已同步记录',true)}</div><div class="grid2"><section class="panel"><div class="panel-head"><h2>使用趋势</h2><button class="textbtn" onclick="setTab('usage')">查看每日明细 →</button></div>${chart(sample)}</section><section class="panel pad"><div class="split-head"><h2>设备状态</h2>${tag(sample?'近期有上报 · 示例':'历史快照','blue')}</div>${kv('最近自报版本',d.version)}${kv('在位 / 亮度 / 距离',sample?'在位 / 5 档 / 0.38 m':'预览未载入 · 详情由真实接口提供')}${kv('数据时间',d.last)}<p class="sub" style="font-size:10px;margin-top:11px">版本自报与活动安装包校验分开展示。</p></section></div><div class="grid2"><section class="panel"><div class="panel-head"><h2>昨日已上报收益</h2><button class="textbtn" onclick="setTab('assets')">查看资产与口径 →</button></div>${sample?`<div class="pad" style="padding-top:0;display:flex;gap:60px"><div class="sub">家族币<p style="font-size:24px;color:var(--ink)">+ 28</p></div><div class="sub">星尘<p style="font-size:24px;color:var(--ink)">+ 6</p></div></div>`:empty('暂无已同步收益','没有业务记录证据，不能推定昨日收益为 0')}</section><section class="panel"><div class="panel-head"><h2>最新获得</h2><span class="sub">只显示可核实的获得</span></div>${sample?`<div class="pad" style="padding-top:0"><b>晴空探险套装</b><p class="sub">上衣 · 帽子 · 鞋子 / 示例</p><div class="coverage">${tag('已获得','green')}${tag('帽子已激活','blue')}</div></div>`:empty('暂无已同步获得','基线库存不作为新获得，未知来源不补成奖励')}</section></div><section class="panel pad"><div class="split-head"><h2>小程序数据覆盖</h2><span class="sub">同源读取 · 按域展示缺口</span></div><div class="coverage">${tag('历史对话已接入','green')}${tag(sample?'使用时长已同步':'使用时长缺测',sample?'green':'amber')}${tag(sample?'业务流水已同步':'业务流水暂无',sample?'green':'')}${tag('完整历史覆盖未承诺')}</div></section>`;
if(tab==='usage')return `<div class="stats">${stat('今日有效使用',sample?'36':'暂无数据','仅统计已上报的有效片段',!sample,sample?'分钟':'')}${stat('近 7 日有效使用',sample?'295':'暂无数据','按北京时间自然日汇总',!sample,sample?'分钟':'')}${stat('有效数据天数',sample?'7':'0','0 天有数据 ≠ 使用 0 天',false,'天')}${stat('历史完整性','未确认','不通过对话间隔反推分钟',true)}</div><section class="panel"><div class="panel-head"><h2>每日使用明细</h2><span class="sub">本页日期随快照固定</span></div>${chart(sample)}<table class="rows v-gap"><thead><tr><th>日期</th><th>有效使用</th><th>数据状态</th><th>来源</th></tr></thead><tbody>${[0,1,2].map((x)=>`<tr><td>2026-11-${sample?17-x:16-x}</td><td>${sample?[36,54,40][x]+' 分钟':'—'}</td><td>${tag(sample?'可用':'缺测',sample?'green':'amber')}</td><td class="mono">${sample?'focus_segment':'no_focus_segments'}</td></tr>`).join('')}</tbody></table></section>`;
if(tab==='assets')return `<div class="note blue"><span class="symbol">i</span><div><strong>余额、收益与获得是不同口径</strong><p>资产来自有效快照；昨日收益只汇总已同步的正常奖励；兼容历史基线不产生新收入或新获得。</p></div></div><div class="stats">${stat('家族币余额',sample?'260':'未知',sample?'normal 快照 · 示例':'预览未载入当前快照',!sample)}${stat('补勤卡库存',sample?'2':'未知','从 inventory 读取',!sample)}${stat('昨日已上报家族币',sample?'+ 28':'暂无数据','按真实提交日与奖励 ID 去重',!sample)}${stat('昨日已上报星尘',sample?'+ 6':'暂无数据','不把基线当作收入',!sample)}</div><section class="panel pad"><h2>最新获得与激活</h2>${sample?kv('晴空探险套装 · 示例','上衣、帽子、鞋子')+kv('获得时间 · 示例','2026-11-17 09:20')+kv('激活状态 · 示例','帽子已激活')+kv('来源 · 示例','normal / 真实奖励来源对应此字段'):empty('暂无可核实的最新获得','保留未知来源与未知时间，不回退旧物品冒充最新')}</section><div class="subsection"><h2>原始状态</h2></div><section class="panel pad">${kv('星尘余额',sample?'42 · 示例':'未知 · 预览未载入')}${kv('快照 / 库存数据',sample?'示例已同步':'预览未载入真实快照')}${kv('覆盖范围','仅展示已同步事实，未承诺完整存档')}</section>${debug(d)}`;
if(tab==='records')return `<section class="panel"><div class="panel-head"><h2>业务流水</h2><span class="sub">${sample?'本预览展示 3 条示例，不代表总数':'历史快照：无已同步记录'}</span></div><div class="filters"><select aria-label="流水类型" onchange="renderRecords(this.value)"><option value="all">全部类型</option><option value="baseline">历史基线</option><option value="reward">奖励 / 状态变更</option></select><span class="sub">原 record_id 保留，基线单独标识</span></div><div id="record-data">${records(d,'all')}</div></section><div class="note blue"><span class="symbol">i</span><div>兼容授权记录标注“原发生归属未验证”；重放不重计，激活不算再次获得。</div></div>${debug(d)}`;
if(tab==='history')return `<section class="panel"><div class="panel-head"><h2>历史对话 <span class="badge blue">${d.history} 条</span></h2><span class="sub">当前家长可见范围</span></div><div class="filters"><input type="date" aria-label="对话开始日期" id="fromDay" value="2026-11-16"><span class="sub">至</span><input type="date" aria-label="对话结束日期" id="toDay" value="2026-11-17"><button class="btn small" onclick="historyQuery()">查询 / 刷新</button></div><div class="note blue" style="margin:0 20px 8px"><span class="symbol">i</span><span>本预览不展示真实儿童原话。${sample?'下方为虚构对话示例。':'186 仅为历史计数；正文位置用说明占位。'}</span></div><div class="timeline" id="historyRows">${historyRows(d)}</div><div class="table-foot"><span id="historyHint">预览展示 2 条布局，正式页每次加载 20 条</span><button class="btn small" onclick="moreHistory()">加载更多</button></div></section><p class="quiet-foot">分页固定查询快照；刷新纳入新消息。无原始归属的历史需明确授权，完整历史覆盖仍未确认。</p>`;
return `<div class="grid2"><section class="panel pad"><h2>账号与绑定</h2>${kv('小程序账号 ID（account_id）',d.account)}${kv('家长手机号（示例）',`<span id="phone">${showPhone?d.phone:masked(d.phone)}</span> <button class="textbtn" onclick="showPhone=!showPhone;renderDetail()">${showPhone?'收起':'查看'}</button>`)}${kv('微信 OpenID','未接入 · 当前未保存')}${kv('小程序 AppID','应用级标识，不作为用户 ID')}${kv('绑定版本','示例值 1')}<p class="sub" style="font-size:11px;margin-top:12px">短信账号也可使用小程序；当前服务端未保存 OpenID，不影响手机号账号与设备的绑定。</p></section><section class="panel pad"><h2>接入与历史授权</h2>${kv('设备 ID',d.publicId)}${kv('设备最近自报版本',d.version)}${kv('R1 上传配置',sample?'示例已开启':'历史快照：cfg-182 / 已开启')}${kv('历史授权','当前绑定范围；完整原发生归属未验证')}${kv('数据来源',sample?'虚构正常数据':'2026-11-16 核查快照')}<p class="sub" style="font-size:11px;margin-top:12px">后台查询只读；不代签家长 token，不改变数据归属。</p></section></div><section class="panel pad"><h2>小程序其他功能接入范围</h2>${['家长任务 / 亲子约定 / 兑换','周报 / 坐姿分析 / 消息中心','孩子档案 / 视光报告 / 反馈','小程序设备设置与配网激活'].map(x=>kv(x,tag('当前 live 页面未接入'))).join('')}<p class="sub" style="margin-top:15px">这些能力在原型中可见，但当前真实小程序未接入；本页不把本机演示数据显示成线上事实。</p></section>${debug(d)}`}
function debug(d){return `<details class="data-detail"><summary>查看字段与数据来源</summary><pre>${esc(JSON.stringify({preview:true,public_id:d.publicId,observed_at:d.last,usage:{available:d.mode==='sample',focus_minutes:d.mode==='sample'?36:null},records:{preview_visible_rows:d.mode==='sample'?3:0,history_complete:false},conversations:{message_count:d.history,history_complete:false},note:'结构示意；正式实现直接展示同源 DTO 的许可字段，不回显令牌。'},null,2))}</pre></details>`}
function records(d,type){if(d.mode!=='sample')return empty('暂无符合条件的已同步记录','服务器已支持兼容接收；当前历史快照尚无设备 R1 业务记录');const rows=[{type:'reward',name:'家族币奖励',id:'demo_record_012',delta:'+ 12 家族币',fmt:'v1',time:'09:30',status:'正常奖励'},{type:'reward',name:'物品激活',id:'demo_record_011',delta:'帽子：未激活 → 已激活',fmt:'兼容格式',time:'09:25',status:'兼容历史授权'},{type:'baseline',name:'历史基线',id:'demo_record_001',delta:'家族币 220 · 补勤卡 1',fmt:'兼容格式',time:'09:00',status:'不计入收益 / 获得'}].filter(r=>type==='all'||r.type===type);return `<div class="table-wrap"><table class="rows"><thead><tr><th>时间 · 示例</th><th>记录 / 原 ID</th><th>内容</th><th>格式</th><th>口径</th></tr></thead><tbody>${rows.map(r=>`<tr><td>11-17 ${r.time}</td><td>${r.name}<div class="mono">${r.id}</div></td><td>${r.delta}</td><td>${tag(r.fmt,'blue')}</td><td>${r.status}</td></tr>`).join('')}</tbody></table></div>`}
function renderRecords(type){$('record-data').innerHTML=records(selected,type)}
function historyRows(d,extra=false){return ['孩子','小可'].map((role,i)=>`<div class="message"><div class="role">${role}<br><small>${extra?'较早消息':'11-16 20:45'}</small></div><div><div class="bubble">${d.mode==='sample'?(i?'好呀，我们先从第一步开始。':'我想完成今天的小任务。'):'历史正文占位：正式页面显示当前授权范围内的'+role+'消息'}</div><small>id: ${d.mode==='sample'?'demo_message_':'preview_placeholder_'}${historyPage*2+i} · ${d.mode==='sample'?'虚构示例':'未读取真实正文'}</small></div></div>`).join('')}
function historyQuery(){if($('fromDay').value>$('toDay').value){toast('开始日期不能晚于结束日期');return}historyPage=1;$('historyRows').innerHTML=historyRows(selected);$('historyHint').textContent='已重置查询；本预览没有请求真实历史';toast('预览查询已重置')}
function moreHistory(){if(historyPage>=2){toast('预览到此；正式接口按游标继续分页');return}historyPage++;$('historyRows').insertAdjacentHTML('beforeend',historyRows(selected,true));$('historyHint').textContent='已演示追加加载，共 4 条布局占位'}
function confirmUnbind(k){const d=devices.find(x=>x.key===k);lastFocus=document.activeElement;$('modal').innerHTML=`<section class="modal"><div class="icon">↗</div><h2 id="modal-title">确认解除小程序绑定？</h2><p class="sub">请核对设备和家长账号。本操作仅解除这台设备的家长关联。</p><div class="identity-mini">${kv('设备',d.name)}${kv('序列号 SN',`<span class="mono">${d.sn}</span>`)}${kv('设备 ID',`<span class="mono">${d.publicId}</span>`)}${kv('家长账号',d.account)}${kv('手机号',masked(d.phone))}</div><ul><li>原家长将无法再查看这台设备的小程序数据。</li><li>设备、存档和原始历史数据保留，不清空队列。</li><li>重新绑定后，对话与 Ark 历史需重新授权；用时仍按设备 SN 汇总。</li></ul><label class="sub" for="reason">操作备注（选填）</label><textarea id="reason" placeholder="例如：联调更换绑定账号" maxlength="200"></textarea><p class="sub" style="font-size:11px;margin-top:8px">设计预览：确认只改变此页面状态，不执行真实解绑。</p><footer><button class="btn" id="cancelUnbind" onclick="closeModal()">取消</button><button class="btn danger-fill" onclick="doUnbind('${k}')">确认解绑</button></footer></section>`;$('modal').classList.remove('hidden');$('cancelUnbind').focus()}
function closeModal(){$('modal').classList.add('hidden');if(lastFocus?.isConnected)lastFocus.focus()}
function doUnbind(k){const d=devices.find(x=>x.key===k);d.bound=false;closeModal();if(selected)renderDetail();else renderRows();if(!selected)list();toast('已模拟解绑；未调用后台，刷新页面可复原')}
document.addEventListener('keydown',e=>{if($('modal').classList.contains('hidden'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=[...$('modal').querySelectorAll('button,textarea')];const first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});list();
</script></body></html>
