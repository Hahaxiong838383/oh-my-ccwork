# Exact P003 analytics endpoint. Include inside the existing TLS server block.
# Keep all existing /v1/, OTA and /myjavis/ locations unchanged.
location = /v1/device/analytics/events:batch {
    client_max_body_size 3m;
    client_body_timeout 15s;
    proxy_pass http://127.0.0.1:3006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 10s;
    proxy_send_timeout 15s;
    proxy_intercept_errors on;
    error_page 502 504 =503 @p003_analytics_unavailable;
    error_page 413 =413 @p003_analytics_too_large;
    access_log off;
}
location @p003_analytics_unavailable {
    default_type application/json;
    add_header Retry-After 900 always;
    add_header Cache-Control no-store always;
    return 503 '{"ok":false,"error_code":"ANALYTICS_UPLOAD_DISABLED","retry_after_ms":900000}';
}
location @p003_analytics_too_large {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 413 '{"ok":false,"error_code":"ANALYTICS_BATCH_TOO_LARGE"}';
}
