<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台搜索 · 小可运营台</title>
  <style>
    :root { color-scheme: light; --ink:#203044; --muted:#647387; --line:#dce2e8; --blue:#245c83; --paper:#f3f5f7; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.65 "PingFang SC","Microsoft YaHei",sans-serif; }
    header { background:#132c42; color:white; padding:24px max(24px,calc((100vw - 1160px)/2)); }
    header a { color:#bdd4e5; text-decoration:none; font-size:13px; } h1 { font-size:26px; margin:12px 0 4px; font-weight:650; } header p { color:#bdd4e5; margin:0; }
    main { max-width:1208px; margin:auto; padding:28px 24px 48px; } .row { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    section { background:white; border:1px solid var(--line); border-radius:8px; padding:24px; margin:0 0 20px; } h2 { font-size:18px; margin:0 0 16px; }
    .badge { background:#edf1f5; border:1px solid var(--line); padding:4px 12px; border-radius:20px; white-space:nowrap; }
    .on { color:#16654e; background:#e8f5ef; border-color:#b5d9c8; } .muted { color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:28px; } label { display:block; margin-bottom:14px; } input[type=checkbox] { width:18px;height:18px;vertical-align:middle;accent-color:var(--blue);margin-right:8px; }
    textarea { display:block; width:100%; min-height:108px; margin-top:8px; padding:10px; font:14px/1.6 ui-monospace,monospace; border:1px solid #aebbc6; border-radius:4px; resize:vertical; }
    button { padding:9px 18px; border:1px solid var(--blue); border-radius:4px; color:white;background:var(--blue);font:inherit;cursor:pointer; }
    button.secondary { color:var(--blue);background:white; } button.danger { color:#a32e30;border-color:#c98586;background:white; } button:disabled { opacity:.45;cursor:not-allowed; }
    button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible { outline:3px solid #81b6db;outline-offset:3px; }
    .actions { display:flex;gap:12px;flex-wrap:wrap;margin-top:20px; } #message { min-height:26px;margin:12px 0;color:#a32e30; } #message.success { color:#16654e; }
    .scroll { overflow-x:auto; } table { width:100%;border-collapse:collapse;font-size:13px; } th { text-align:left; background:#f5f7f9; color:#56677b; font-weight:500; } th,td { padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap; }
    td:first-child { font-family:ui-monospace,monospace; } #empty { padding:32px;text-align:center;color:var(--muted); }
    @media(max-width:700px) { .grid { grid-template-columns:1fr;gap:10px; } main { padding:16px; } section { padding:18px; } .row { flex-wrap:wrap; } h1 { font-size:23px; } }
  </style>
</head>
<body>
<header><a href="/admin/">← 返回运营台</a><h1>小可 · 后台搜索</h1><p>查询在后台运行，语音对话继续。结果在空闲时补充。</p></header>
<main>
  <section>
    <div class="row"><h2>发布范围</h2><span id="status" class="badge">读取中</span></div>
    <p id="configured" class="muted"></p>
    <form id="settings">
      <div class="grid">
        <div><label><input id="enabled" type="checkbox">开启搜索总闸</label><label><input id="tools" type="checkbox">启用网页正文抓取与智能工具调用</label><p class="muted">不开启第二项时，仅进行受控网页搜索。普通聊天不等待查询结果。初次发布仅填写一台测试设备。</p></div>
        <label for="devices">目标设备完整 SN<textarea id="devices" placeholder="每行一个完整设备 SN" spellcheck="false"></textarea><span class="muted">空名单不允许开启。Worker 端还需具备对应版本与设备范围。</span></label>
      </div>
      <div class="actions"><button id="save" disabled>保存范围与开关</button><button id="stop" class="danger" type="button" disabled>立即关闸并取消任务</button><button id="reload" class="secondary" type="button">重新读取</button></div>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </section>
  <section>
    <div class="row"><h2>最近任务</h2><button id="refresh" class="secondary" type="button">刷新任务</button></div>
    <p class="muted">区分执行完成与实际播出。仅展示脱敏状态与耗时，不展示用户原话、网页正文或凭据。</p>
    <div class="scroll"><table><thead><tr><th>任务 ID</th><th>设备尾号</th><th>创建时间</th><th>任务状态</th><th>播报回执</th><th>就绪耗时</th><th>来源数</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div id="empty">尚未读取任务</div>
  </section>
</main>
<script>
  const $=id=>document.getElementById(id);
  const labels={queued:'排队中',running:'查询中',ready:'结果就绪',delivered:'已结束',failed:'执行失败',cancelled:'已取消',expired:'已过期',pending:'待播报',claimed:'已领取待播',completed:'完整播出',interrupted:'被打断',dropped:'未播出',unknown:'播报状态待核实'};
  let current=null;
  async function api(path,body) {
    const token=localStorage.getItem('kidshub_admin_token');
    if(!token) throw new Error('请先返回运营台登录管理员账号。');
    const r=await fetch('/api/admin/search/'+path,{method:body===undefined?'GET':'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
    if(r.status===401) throw new Error('登录已失效，请返回运营台重新登录。');
    if(r.status===403) throw new Error('仅管理员可以查看和操作搜索功能。');
    if(!r.ok) throw new Error('操作未成功，请核对服务器配置、设备状态和目标名单。');
    return r.json();
  }
  function message(text,ok=false){$('message').textContent=text;$('message').className=ok?'success':'';}
  function renderSettings(s){current=s;$('enabled').checked=s.enabled;$('tools').checked=s.tools;$('devices').value=s.allowed.join('\n');$('status').textContent=s.enabled?'总闸已开启':'总闸已关闭';$('status').className='badge'+(s.enabled?' on':'');$('configured').textContent=s.configured?'服务器基础配置已就绪；是否通过真机验收需查看发布回执。':'服务器基础配置尚未就绪，当前不可开启。';if(s.upstream&&!s.upstream.available)$('configured').textContent+=' 上游暂不可用（'+s.upstream.reason+'），新查询暂停至 '+new Date(s.upstream.retry_at).toLocaleTimeString('zh-CN')+'。';$('save').disabled=false;$('stop').disabled=false;}
  async function load(){try{renderSettings(await api('settings'));message('已读回服务器配置。',true);await tasks();}catch(e){message(e.message);$('save').disabled=true;$('stop').disabled=true;$('status').textContent='读取失败';}}
  async function tasks(){try{const d=await api('tasks');$('rows').replaceChildren();for(const t of d.tasks){const tr=document.createElement('tr');for(const v of [t.id,t.device_suffix,new Date(t.created_at).toLocaleString('zh-CN'),labels[t.status]||t.status,labels[t.delivery]||t.delivery,t.execution_ms==null?'—':t.execution_ms+' ms',t.source_count]){const td=document.createElement('td');td.textContent=String(v);tr.appendChild(td);}$('rows').appendChild(tr);}$('empty').hidden=d.tasks.length>0;$('empty').textContent=d.loaded?'暂无任务。':'当前进程尚未加载搜索账本；不代表历史没有任务。';}catch(e){message(e.message);}}
  $('settings').addEventListener('submit',async e=>{e.preventDefault();$('save').disabled=true;try{const body={enabled:$('enabled').checked,tools:$('tools').checked,allowlist:$('devices').value.split(/[\s,，]+/).filter(Boolean)};renderSettings(await api('settings',body));message('配置已保存并读回。',true);await tasks();}catch(err){message(err.message);}finally{$('save').disabled=false;}});
  $('stop').addEventListener('click',async()=>{if(!current)return;$('stop').disabled=true;try{renderSettings(await api('settings',{enabled:false,tools:current.tools,allowlist:current.allowed}));message('总闸已关闭，在途和待播任务已取消。',true);await tasks();}catch(e){message(e.message);}finally{$('stop').disabled=false;}});
  $('reload').addEventListener('click',load);$('refresh').addEventListener('click',tasks);load();
</script>
</body>
</html>
