<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 374" role="img" aria-labelledby="title desc">
<title id="title">Air EasyTier 家庭与香港双栈发现入口</title>
<desc id="desc">Air 可通过两个家庭域名连接 Lucky，再连接 NAS2 的 EasyTier；香港 IPv4 和 IPv6 入口并列保留。此图表示入网入口，不代表实时业务流量路径。</desc>
