<rect width="900" height="374" rx="8" fill="#0d1117"/>
<g fill="none" stroke-width="1.5"><rect x="160" y="18" width="730" height="191" rx="8" stroke="#294435" stroke-dasharray="4 4"/><rect x="160" y="229" width="468" height="115" rx="8" stroke="#2c4565" stroke-dasharray="4 4"/>
<path d="M138 166H150V80H174" stroke="#69d791" marker-end="url(#home-arrow)"/><path d="M150 166H174" stroke="#69d791" marker-end="url(#home-arrow)"/>
<path d="M380 80H401V118H427" stroke="#69d791" marker-end="url(#home-arrow)"/><path d="M380 166H401V118" stroke="#69d791"/>
<path d="M613 118H658" stroke="#69d791" marker-end="url(#home-arrow)"/>
<path d="M138 166H150V291H174" stroke="#79b8ff" marker-end="url(#hk-arrow)"/>
<path d="M613 291H658" stroke="#79b8ff" marker-end="url(#hk-arrow)"/>
<path d="M769 159V251" stroke="#69d791" marker-end="url(#home-arrow)"/>
</g>
