# ═══ studio · Mac Studio M2 Max · 公司有线 192.168.61.177 · 算力节点 ═══
# 不导出子网（mini/dev198 已覆盖公司段），只做纯成员

hostname = "studio"
instance_name = "main"
ipv4 = "10.10.10.12"

listeners = [
    "tcp://0.0.0.0:11010",
    "udp://0.0.0.0:11010",
]

# ── 网络身份（决定谁和谁是同一张网）──
# 必须与所有其他节点完全一致；不一致的症状是「connector 显示 Connected 但 peer 表空」，
# 因为 TCP/UDP 通道建得起来，只是握手鉴权不过 —— 极容易误判成打洞失败。
[network_identity]
network_name = "__NETWORK_NAME__"
network_secret = "__NETWORK_SECRET__"

[[peer]]
uri = "tcp://85.189.55.23:443"
[[peer]]
uri = "udp://85.189.55.23:22"
# 第三条通道：2026-08-16 面板加了 udp 11010 规则后补上。
# 实测它与 udp:22 在丢包/吞吐上**没有差别**（21.5% vs 18.5%，均 ~86Mbps），
# 加它不是为了性能，是为了多一条独立路径：中间网络掐掉任一条还有另两条。

[[peer]]
uri = "tcp://192.168.61.66:11010"    # mini
[[peer]]
uri = "tcp://192.168.61.233:11010"   # dev198

[flags]
private_mode = true
latency_first = true
multi_thread = true
bind_device = true
accept_dns = false
enable_kcp_proxy = false
