# ═══ jidinghe-armbian · MGV3001-ZG · 家有线 192.168.1.226 ═══
# Armbian 24.11 / Ubuntu 24.04 / Linux 6.1.114-ophub / ARM64
# 角色：常驻普通节点。根分区在内部 eMMC；不承担家庭网段代理。

hostname = "jidinghe-armbian"
instance_name = "main"
ipv4 = "10.10.10.25"

listeners = [
    "tcp://0.0.0.0:11010",
    "udp://0.0.0.0:11010",
]

[network_identity]
network_name = "__NETWORK_NAME__"
network_secret = "__NETWORK_SECRET__"

# 只使用供应商防火墙已验证放行的两条上游通道。
[[peer]]
uri = "tcp://207.57.124.191:443"
[[peer]]
uri = "udp://207.57.124.191:22"

# 家庭局域网内的常驻节点，香港中继异常时仍可就近发现并直连。
[[peer]]
uri = "tcp://192.168.1.119:11010"    # linux-lan
[[peer]]
uri = "tcp://192.168.1.115:11010"    # fnos2

# 不配置 proxy_network：家侧网段已有 linux-lan + fnos2 双网关。
[flags]
dev_name = "easytier0"
private_mode = true
latency_first = true
multi_thread = true
bind_device = true
accept_dns = false
enable_kcp_proxy = false
