# ═══ dev198 · HP ZBook Ubuntu 26.04 · 公司有线 192.168.61.233 ═══
# 角色：公司侧子网网关（备）—— 与 mini 同时导出 192.168.61.0/24 是**故意的**冗余。
# EasyTier 允许多节点导出同一 CIDR，latency_first 会挑当前更快的那条；
# 任一台关机不影响家里访问公司内网。看到「两个节点导出同一段」不要当成配置重复去删。

hostname = "dev198"
instance_name = "main"
ipv4 = "10.10.10.13"

listeners = [
    "tcp://0.0.0.0:11010",
    "udp://0.0.0.0:11010",
]

# ── 网络身份（决定谁和谁是同一张网）──
# 必须与所有其他节点完全一致；不一致的症状是「connector 显示 Connected 但 peer 表空」，
# 因为 TCP/UDP 通道建得起来，只是握手鉴权不过 —— 极容易误判成打洞失败。
[network_identity]
network_name = "__NETWORK_NAME__"
network_secret = "__NETWORK_SECRET__"

[[peer]]
uri = "tcp://207.57.124.191:443"
[[peer]]
uri = "udp://207.57.124.191:22"
# 第三条通道：2026-08-16 面板加了 udp 11010 规则后补上。
# 实测它与 udp:22 在丢包/吞吐上**没有差别**（21.5% vs 18.5%，均 ~86Mbps），
# 加它不是为了性能，是为了多一条独立路径：中间网络掐掉任一条还有另两条。

[[peer]]
uri = "tcp://192.168.61.66:11010"    # mini
[[peer]]
uri = "tcp://192.168.61.177:11010"   # studio

[[proxy_network]]
cidr = "192.168.61.0/24"
mapped_cidr = "10.10.61.0/24"

[flags]
dev_name = "easytier0"
private_mode = true
latency_first = true
multi_thread = true
bind_device = true
accept_dns = false
enable_kcp_proxy = false
