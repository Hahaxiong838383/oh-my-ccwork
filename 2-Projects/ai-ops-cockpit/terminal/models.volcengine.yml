providers:
  volcengine-coding:
    baseUrl: https://ark.cn-beijing.volces.com/api/coding/v3
    apiKey: '!if [ -r /run/secrets/volcengine_coding_api_key ]; then cat /run/secrets/volcengine_coding_api_key; else printf %s "$VOLCENGINE_CODING_API_KEY"; fi'
    api: openai-completions
    compat:
      maxTokensField: max_tokens
    models:
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro (Volcengine Coding Plan)
        reasoning: true
        input: [text]
        supportsTools: true
        contextWindow: 1048576
        maxTokens: 65536
