services:
  ops-auth:
    build: ./auth-gateway
    container_name: ops-auth
    restart: unless-stopped
    environment:
      OPS_AUTH_USER: chuan
      OPS_AUTH_PASSWORD: ${OPS_AUTH_PASSWORD}
      OPS_AUTH_SECRET: ${OPS_AUTH_SECRET}
      OPS_AUTH_COOKIE: ${OPS_AUTH_COOKIE}
      OPS_AUTH_MAX_AGE: 2592000
      N8N_URL: http://n8n:5678
      N8N_EMAIL: ${N8N_EMAIL}
      N8N_PASSWORD: ${N8N_PASSWORD}

  caddy:
    image: caddy:2
    container_name: ops-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - homepage
      - uptime-kuma
      - dockge

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: ops-homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "23.226.135.149,localhost,127.0.0.1,ops.hahaxiong.top"
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: ops-uptime-kuma
    restart: unless-stopped
    volumes:
      - ./kuma/data:/app/data

  netdata:
    image: netdata/netdata:stable
    container_name: ops-netdata
    restart: unless-stopped
    environment:
      NETDATA_HOSTNAME: racknerd-54aa08d
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./netdata/config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro

  ops-inspector:
    build: ./ops-inspector
    container_name: ops-inspector
    restart: unless-stopped
    environment:
      KUMA_DB: /kuma/kuma.db
      NETDATA_URL: http://netdata:19999
      DISPLAY_HOSTNAME: racknerd-54aa08d
      TZ: Asia/Shanghai
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL}
      OPS_READ_TOKEN: ${OPS_READ_TOKEN}
      OPS_ACTION_TOKEN: ${OPS_ACTION_TOKEN}
      AI_OPS_INTERNAL_TOKEN: ${AI_OPS_INTERNAL_TOKEN}
      AI_OPS_BRAIN_URL: http://ops-brain:8090
      AI_OPS_TOOL_RUNNER_URL: http://ops-tool-runner:8091
      AI_OPS_OMP_MODEL: ${AI_OPS_OMP_MODEL:-volcengine-coding/deepseek-v4-pro}
      AI_OPS_OMP_MODEL_LABEL: ${AI_OPS_OMP_MODEL_LABEL:-DeepSeek V4 Pro}
      READONLY_ROOT: /workspace/readonly
      ALLOWLIST_DIR: /config
      STATE_DIR: /var/lib/ai-ops-state
      TOOL_AUDIT_DIR: /tool-runner-state/audit
      OMP_UPDATE_STATE_FILE: /workspace/ai-ops-root/terminal/runtime/update-state.json
      SELF_MONITOR_TERMINAL_MAX_CLIENTS: 1
      CHENCHUAN_DAILY_PUSH_URL: ${CHENCHUAN_DAILY_PUSH_URL:-}
      CPA_DAILY_PUSH_URL: ${CPA_DAILY_PUSH_URL:-}
      IPTV_DAILY_PUSH_URL: ${IPTV_DAILY_PUSH_URL:-}
      VOICE_DAILY_PUSH_URL: ${VOICE_DAILY_PUSH_URL:-}
      PRODUCTION_SSH_DIR: /run/secrets/chenchuan-maintenance
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 挂整个 data 目录，确保能读到 SQLite WAL/SHM；只挂 kuma.db 会读到过期心跳
      - ./kuma/data:/kuma:ro
      - ./terminal/logs:/terminal-logs:ro
      - ./readonly:/workspace/readonly
      - ./config:/config:ro
      - ./:/workspace/ai-ops-root:ro
      - /opt/ai-ops-workspaces:/opt/ai-ops-workspaces:ro
      - ./ops-inspector/state:/var/lib/ai-ops-state
      - ops_tool_runner_state:/tool-runner-state:ro
      - ./secrets/chenchuan-maintenance:/run/secrets/chenchuan-maintenance:ro
      - ./secrets/cpa-jp-maintenance:/run/secrets/cpa-jp-maintenance:ro
      - ./secrets/iptv-maintenance:/run/secrets/iptv-maintenance:ro
      - ./secrets/qihang-hk-maintenance:/run/secrets/qihang-hk-maintenance:ro
    depends_on:
      uptime-kuma:
        condition: service_started
      netdata:
        condition: service_started
      ops-brain:
        condition: service_healthy
      ops-tool-runner:
        condition: service_healthy

  ops-tool-runner:
    build: ./ops-readonly-runner
    container_name: ops-tool-runner
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      AI_OPS_INTERNAL_TOKEN: ${AI_OPS_INTERNAL_TOKEN}
      AI_OPS_READONLY_PROJECTS: mycc,chenchuan-site,cpa-smart-router,iptv-api,MyJavis,realtime-voice-agent,P003GameDemo20260513
      READONLY_ROOT: /workspace/readonly
      AUDIT_DIR: /var/lib/aiops-tool-runner/audit
    volumes:
      - ./readonly:/workspace/readonly:ro
      - ops_tool_runner_state:/var/lib/aiops-tool-runner
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8091/health',timeout=3)); assert data['ok'] and data['mountReadonly']"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  ops-brain:
    build: ./terminal
    container_name: ops-brain
    restart: unless-stopped
    mem_limit: 640m
    cpus: 0.60
    pids_limit: 192
    command: ["python3", "/usr/local/lib/aiops-brain-server.py"]
    environment:
      TZ: Asia/Shanghai
      AI_OPS_OMP_MODEL: ${AI_OPS_OMP_MODEL:-volcengine-coding/deepseek-v4-pro}
      AI_OPS_OMP_MODEL_LABEL: ${AI_OPS_OMP_MODEL_LABEL:-DeepSeek V4 Pro}
      AI_OPS_INTERNAL_TOKEN: ${AI_OPS_INTERNAL_TOKEN}
      AI_OPS_TOOL_RUNNER_URL: http://ops-tool-runner:8091/tool
      AI_OPS_BRAIN_AGENT_DIR: /home/ops/.omp/brain-agent
      AI_OPS_BRAIN_CWD: /workspace/brain/session
    secrets:
      - volcengine_coding_api_key
    volumes:
      - ./terminal/omp:/home/ops/.omp
      - ./terminal/runtime:/opt/omp-runtime
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /workspace/brain:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      ops-tool-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3)); assert data['ok'] and data['toolMode']=='readonly_safe' and data['ambientExtensions']==0 and data['agentDir']=='/home/ops/.omp/brain-agent' and data['workdir']=='/workspace/brain/session' and data['workdirReady'] and not data['directWorkspace'] and not data['dockerSocket'] and not data['productionSsh']"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 15s

  n8n:
    image: n8nio/n8n:latest
    container_name: ops-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ops.hahaxiong.top
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_PATH: /n8n/
      WEBHOOK_URL: https://ops.hahaxiong.top/n8n/
      N8N_EDITOR_BASE_URL: https://ops.hahaxiong.top/n8n/
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: 1
      N8N_USER_MANAGEMENT_DISABLED: "true"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: chuan
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
    volumes:
      - ./n8n/data:/home/node/.n8n

  ops-terminal:
    build:
      context: ./terminal
    container_name: ops-terminal
    restart: unless-stopped
    mem_limit: 448m
    cpus: 0.35
    pids_limit: 128
    environment:
      TZ: Asia/Shanghai
      AI_OPS_OMP_MODEL: ${AI_OPS_OMP_MODEL:-volcengine-coding/deepseek-v4-pro}
      AI_OPS_OMP_MODEL_LABEL: ${AI_OPS_OMP_MODEL_LABEL:-DeepSeek V4 Pro}
      AI_OPS_INTERNAL_TOKEN: ${AI_OPS_INTERNAL_TOKEN}
      AI_OPS_TOOL_RUNNER_URL: http://ops-tool-runner:8091/tool
      AI_OPS_BRAIN_AGENT_DIR: /home/ops/.omp/terminal-agent
      AI_OPS_BRAIN_CWD: /workspace/brain/session
    secrets:
      - volcengine_coding_api_key
    volumes:
      - ./terminal/logs:/var/log/ops-terminal
      - ./terminal/omp:/home/ops/.omp
      - ./terminal/runtime:/opt/omp-runtime
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /workspace/brain:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      ops-inspector:
        condition: service_started
      ops-tool-runner:
        condition: service_healthy

  dockge:
    build: ./dockge
    image: ai-ops-dockge-subpath:1
    container_name: ops-dockge
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dockge/data:/app/data
      - /opt/stacks:/opt/stacks
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks

volumes:
  caddy_data:
  caddy_config:
  netdata_lib:
  netdata_cache:
  ops_tool_runner_state:

secrets:
  volcengine_coding_api_key:
    file: ./secrets/volcengine-coding/api-key
