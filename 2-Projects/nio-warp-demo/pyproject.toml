[project]
name = "nio-warp-demo"
version = "0.1.0"
description = "最小可行的全反射面预畸变闭环 Demo"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<12",
  "scipy>=1.14,<2",
]

[project.scripts]
nio-warp-demo = "warp_demo.cli:main"
nio-warp-display-demo = "warp_demo.display_server:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warp_demo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
