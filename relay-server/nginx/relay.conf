# MyCC Relay Server - Nginx 配置
# 部署前：
# 1. 将 relay.hahaxiong.cc 替换为你的实际域名
# 2. 用 certbot 申请 SSL 证书
# 3. 确认证书路径正确

server {
    listen 80;
    server_name relay.hahaxiong.cc;

    # HTTP → HTTPS 重定向
    location / {
        return 301 https://$host$request_uri;
    }

    # Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name relay.hahaxiong.cc;

    # SSL 证书（Let's Encrypt）
    ssl_certificate     /etc/letsencrypt/live/relay.hahaxiong.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.hahaxiong.cc/privkey.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # WS 隧道连接（24h 长连接）
    location /tunnel {
        proxy_pass http://relay:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;  # 24 小时
        proxy_send_timeout 86400;
    }

    # WS 代理（终端等场景）
    location /ws/ {
        proxy_pass http://relay:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # SSE 透传（关键：关闭缓冲）
    location /api/ {
        proxy_pass http://relay:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 核心：关闭所有缓冲，SSE 逐 chunk 透传
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        chunked_transfer_encoding on;

        # 超时放宽（SSE 流可能持续很久）
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # 其他路由（注册、健康检查、管理面板等）
    location / {
        proxy_pass http://relay:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
