services:
  relay:
    build: .
    container_name: mycc-relay
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: mycc-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/relay.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - relay
