# model 不在此声明：项目级会覆盖各机器的用户级 ~/.codex/config.toml，
# 而两端用户级都已是 gpt-5.6-sol。模型选择跟机器/账号走，不跟仓库走。
# （2026-08-22：此处原为 gpt-5.3-codex，静默覆盖了 Air 与 home-studio 两边的配置）
model_reasoning_effort = "high"
personality = "pragmatic"
sandbox_mode = "danger-full-access"

[mcp_servers.memory]
type = "stdio"
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-memory",
]

[mcp_servers.context7]
type = "stdio"
command = "npx"
args = [
    "-y",
    "@upstash/context7-mcp",
]

[mcp_servers.sequential-thinking]
type = "stdio"
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-sequential-thinking",
]

[mcp_servers.ghost-os]
command = "/Users/rayman.chen/mycc/ghost-os/.build/release/ghost"
args = ["mcp"]

[mcp_servers.open-feishu-mcp]
command = "sh"
args = [
    "-lc",
    "exec node /Users/rayman.chen/mycc/open-feishu-mcp-server/dist/local.js --app-id cli_a9f1cd1366751bc7 --app-secret \"$(security find-generic-password -s open-feishu-mcp-app-secret -a cli_a9f1cd1366751bc7 -w)\"",
]

[mcp_servers.openspace]
command = "/Users/rayman.chen/mycc/2-Projects/openspace/start-mcp.sh"
