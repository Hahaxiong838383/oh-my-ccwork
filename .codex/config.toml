model = "gpt-5.3-codex"
model_reasoning_effort = "xhigh"
personality = "pragmatic"

[mcp_servers]

[mcp_servers.fetch]
type = "stdio"
command = "cmd"
args = ["/c", "set PIP_NO_INDEX=&& set HTTP_PROXY=&& set HTTPS_PROXY=&& set ALL_PROXY=&& py -m mcp_server_fetch"]

[mcp_servers.time]
type = "stdio"
command = "cmd"
args = ["/c", "set PIP_NO_INDEX=&& set HTTP_PROXY=&& set HTTPS_PROXY=&& set ALL_PROXY=&& py -m mcp_server_time"]

[mcp_servers.memory]
type = "stdio"
command = "cmd"
args = ["/c", "npx", "-y", "@modelcontextprotocol/server-memory"]

[mcp_servers.context7]
type = "stdio"
command = "cmd"
args = ["/c", "npx", "-y", "@upstash/context7-mcp"]

[mcp_servers.sequential-thinking]
type = "stdio"
command = "mcp-server-sequential-thinking.cmd"

[mcp_servers.feishu]
url = "https://feishu-mcp-server.hahaxiong83.workers.dev/mcp"
bearer_token_env_var = "FEISHU_MCP_BEARER_TOKEN"
