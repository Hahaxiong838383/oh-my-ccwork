<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞书授权二维码</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    h1 {
      color: #333;
      margin: 0 0 20px 0;
    }
    .qr-container {
      margin: 20px 0;
    }
    img {
      width: 300px;
      height: 300px;
      border-radius: 8px;
    }
    .status {
      color: #666;
      margin-top: 20px;
      padding: 10px 20px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .refresh-btn {
      margin-top: 20px;
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .refresh-btn:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 飞书用户授权</h1>
    <div class="qr-container">
      <img id="qrcode" src="feishu-user-auth-qr.png" alt="授权二维码">
    </div>
    <div class="status" id="status">等待扫码授权...</div>
    <button class="refresh-btn" onclick="location.reload()">刷新二维码</button>
  </div>
  <script>
    // 每5秒检查授权状态
    async function checkStatus() {
      try {
        const res = await fetch('http://localhost:18081/status');
        const data = await res.json();
        if (data.authorized) {
          document.getElementById('status').innerHTML = '✅ 授权成功！令牌已获取';
          document.getElementById('status').style.background = '#d4edda';
          document.getElementById('status').style.color = '#155724';
        }
      } catch (e) {
        // 静默处理
      }
    }
    setInterval(checkStatus, 5000);
  </script>
</body>
</html>
