name: P1-SI Runtime Verify

on:
  workflow_dispatch:
    inputs:
      h_lite_source_commit:
        description: Full pushed release commit of Hahaxiong838383/feishu-grok-bridge
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: p1-si-runtime-verify
  cancel-in-progress: false

jobs:
  verify-linux-amd64:
    name: Collector image and PostgreSQL runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Checkout immutable H-Lite source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Hahaxiong838383/feishu-grok-bridge
          ref: ${{ inputs.h_lite_source_commit }}
          path: runtime-h-lite
          ssh-key: ${{ secrets.P1_SI_HLITE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Bind immutable H-Lite source
        id: hlite
        shell: bash
        env:
          H_LITE_SOURCE_COMMIT: ${{ inputs.h_lite_source_commit }}
        run: |
          set -euo pipefail
          case "$H_LITE_SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo 'h_lite_source_commit must be lowercase hex' >&2; exit 1 ;;
          esac
          test "${#H_LITE_SOURCE_COMMIT}" -eq 40
          mkdir -p runtime-evidence
          git -C runtime-h-lite rev-parse HEAD | grep -qx "$H_LITE_SOURCE_COMMIT"
          git -C runtime-h-lite archive --format=tar --prefix=feishu-grok-bridge/ "$H_LITE_SOURCE_COMMIT" \
            | gzip -n > runtime-evidence/h-lite-source.tar.gz
          npm ci --prefix runtime-h-lite
          ln -s "$GITHUB_WORKSPACE/runtime-h-lite" 2-Projects/feishu-grok-bridge
          node --test \
            runtime-h-lite/test/company-agent-core-client.test.mjs \
            runtime-h-lite/test/company-qnap-lite-profile.test.mjs \
            runtime-h-lite/test/company-qnap-lite-service.test.mjs
          archive_sha=$(sha256sum runtime-evidence/h-lite-source.tar.gz | awk '{print $1}')
          {
            echo "source_commit=$H_LITE_SOURCE_COMMIT"
            echo "archive_sha=$archive_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Verify contracts and packages
        shell: bash
        run: |
          set -euo pipefail
          project=2-Projects/company-ai-ontology
          npm ci --ignore-scripts --prefix "$project/services/agent-core"
          npm ci --ignore-scripts --prefix "$project/services/knowledge-connector"
          npm test --prefix "$project/packages/ontology-contracts"
          npm run compile:pestim --prefix "$project/packages/ontology-contracts"
          npm run compile:source-registry --prefix "$project/packages/ontology-contracts"
          npm run compile:data-foundation --prefix "$project/packages/ontology-contracts"
          npm run compile:reporting --prefix "$project/packages/ontology-contracts"
          npm run compile:p003-review --prefix "$project/packages/ontology-contracts"
          npm test --prefix "$project/services/agent-core"
          npm test --prefix "$project/services/knowledge-connector"
          npm test --prefix "$project/services/intelligence-collector"
          npm test --prefix "$project/deploy/qnap/strategic-intelligence"
          npm run validate --prefix "$project/deploy/qnap/strategic-intelligence"

      - name: Build immutable Collector image
        id: image
        shell: bash
        env:
          IMAGE_TAG: company-intelligence-collector:${{ github.sha }}
        run: |
          set -euo pipefail
          project=2-Projects/company-ai-ontology
          SOURCE_COMMIT="$GITHUB_SHA" IMAGE_TAG="$IMAGE_TAG" \
            "$project/services/intelligence-collector/scripts/build-image.sh"
          image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_TAG")
          case "$image_id" in sha256:*) ;; *) echo 'image id is not immutable' >&2; exit 1 ;; esac
          test "$platform" = linux/amd64
          mkdir -p runtime-evidence
          docker save "$IMAGE_TAG" | gzip -n > runtime-evidence/collector-image.tar.gz
          archive_sha=$(sha256sum runtime-evidence/collector-image.tar.gz | awk '{print $1}')
          printf 'image_id=%s\nplatform=%s\narchive_sha=%s\n' "$image_id" "$platform" "$archive_sha" > runtime-evidence/image.env
          {
            echo "image_id=$image_id"
            echo "platform=$platform"
            echo "archive_sha=$archive_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Goal 7 authority and runtime foundation
        id: goal7
        shell: bash
        env:
          VALIDATION_POSTGRES_IMAGE: pgvector/pgvector:pg17-bookworm@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        run: |
          set -euo pipefail
          project=2-Projects/company-ai-ontology
          PROJECT_ROOT="$project" VALIDATION_RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$project/deploy/qnap/scripts/validate-goal7-foundation-isolated.sh" \
            | tee runtime-evidence/goal7-foundation-validation.txt
          grep -qx 'goal7_candidate_migration=verified' runtime-evidence/goal7-foundation-validation.txt
          grep -qx 'goal7_candidate_idempotent=verified' runtime-evidence/goal7-foundation-validation.txt
          grep -qx 'goal7_forced_rls=4' runtime-evidence/goal7-foundation-validation.txt
          grep -qx 'goal7_acl_fail_closed=verified' runtime-evidence/goal7-foundation-validation.txt
          grep -qx 'goal7_app_role_rw=verified' runtime-evidence/goal7-foundation-validation.txt
          grep -qx 'goal7_route_state=route-a:true,route-b:false' runtime-evidence/goal7-foundation-validation.txt
          grep -qx 'goal7_sensitive_body_columns=0' runtime-evidence/goal7-foundation-validation.txt
          {
            echo 'authority_runtime_foundation=verified'
            echo 'route_b=disabled'
          } >> "$GITHUB_OUTPUT"

      - name: Validate candidate PostgreSQL migrations
        id: postgres
        shell: bash
        env:
          VALIDATION_POSTGRES_IMAGE: pgvector/pgvector:pg17-bookworm@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        run: |
          set -euo pipefail
          project=2-Projects/company-ai-ontology
          PROJECT_ROOT="$project" VALIDATION_RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$project/deploy/qnap/strategic-intelligence/scripts/validate-candidate-migrations-isolated.sh" \
            | tee runtime-evidence/postgres-validation.txt
          grep -qx 'domain_persistence=verified' runtime-evidence/postgres-validation.txt
          grep -qx 'domain_persistence_idempotent=verified' runtime-evidence/postgres-validation.txt
          grep -qx 'acl_fail_closed=verified' runtime-evidence/postgres-validation.txt
          {
            echo 'domain_persistence=verified'
            echo 'domain_persistence_idempotent=verified'
            echo 'acl_fail_closed=verified'
          } >> "$GITHUB_OUTPUT"

      - name: Build immutable release candidate
        id: release
        shell: bash
        env:
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
          IMAGE_ARCHIVE_SHA: ${{ steps.image.outputs.archive_sha }}
          H_LITE_SOURCE_COMMIT: ${{ steps.hlite.outputs.source_commit }}
          H_LITE_SOURCE_ARCHIVE_SHA: ${{ steps.hlite.outputs.archive_sha }}
        run: |
          set -euo pipefail
          project=2-Projects/company-ai-ontology
          git archive --format=tar.gz --prefix=company-ai-ontology/ "${GITHUB_SHA}:${project}" \
            > runtime-evidence/source.tar.gz
          source_sha=$(sha256sum runtime-evidence/source.tar.gz | awk '{print $1}')
          node "$project/deploy/qnap/strategic-intelligence/scripts/extract-runtime-component-versions.mjs" \
            "$project" runtime-h-lite "$GITHUB_SHA" "$H_LITE_SOURCE_COMMIT" \
            runtime-evidence/runtime-component-versions.json >/dev/null
          component_versions_sha=$(sha256sum runtime-evidence/runtime-component-versions.json | awk '{print $1}')
          export SOURCE_ARCHIVE_SHA="$source_sha"
          export RUNTIME_COMPONENT_VERSIONS_SHA="$component_versions_sha"
          export AGENT_CORE_VERSION="$(jq -r '.agentCoreVersion' runtime-evidence/runtime-component-versions.json)"
          export KNOWLEDGE_CONNECTOR_VERSION="$(jq -r '.knowledgeConnectorVersion' runtime-evidence/runtime-component-versions.json)"
          export H_LITE_VERSION="$(jq -r '.hLiteVersion' runtime-evidence/runtime-component-versions.json)"
          node <<'NODE'
          const fs = require('node:fs')
          const manifest = {
            manifestVersion: '1.4.0',
            releaseType: 'P1-SI-F-shadow-candidate-gated',
            createdAt: new Date().toISOString(),
            sourceCommit: process.env.GITHUB_SHA,
            hLiteSourceCommit: process.env.H_LITE_SOURCE_COMMIT,
            collectorImageId: process.env.IMAGE_ID,
            sourceArchiveSha256: process.env.SOURCE_ARCHIVE_SHA,
            hLiteSourceArchiveSha256: process.env.H_LITE_SOURCE_ARCHIVE_SHA,
            collectorImageArchiveSha256: process.env.IMAGE_ARCHIVE_SHA,
            runtimeComponentVersionsSha256: process.env.RUNTIME_COMPONENT_VERSIONS_SHA,
            agentCoreVersion: process.env.AGENT_CORE_VERSION,
            knowledgeConnectorVersion: process.env.KNOWLEDGE_CONNECTOR_VERSION,
            hLiteVersion: process.env.H_LITE_VERSION,
            candidateOntologySchema: '3.7.0',
            candidateOntologyHash: 'c7378774a4e0ca406952e1f1b6515e4ec026347f46533e6662b535407cae1860',
            sourceRegistryCandidateHash: '0ce4022adcfc177ced670a8d7fd2e4b4e119c2fc1bc5c19cabefb3223c010eae',
            publish: false,
            productionDeploymentAuthorized: false,
            requiredGate: 'WAIT_GOAL7_AND_EXPLICIT_DEPLOY_AUTH',
            p003ReviewGateRequired: true,
            reviewerRoleAccessGateRequired: true,
            goal7AcceptanceGateRequired: true,
            goal7Migration012Mode: 'pre_existing_reconciliation_only',
            goal7Migration012SqlReplayAllowed: false,
          }
          fs.writeFileSync('runtime-evidence/release-manifest.json', `${JSON.stringify(manifest, null, 2)}\n`, { mode: 0o600 })
          NODE
          node "$project/deploy/qnap/strategic-intelligence/scripts/validate-release-manifest.mjs" \
            runtime-evidence/release-manifest.json \
            runtime-evidence/source.tar.gz \
            runtime-evidence/h-lite-source.tar.gz \
            runtime-evidence/collector-image.tar.gz \
            runtime-evidence/runtime-component-versions.json
          manifest_sha=$(sha256sum runtime-evidence/release-manifest.json | awk '{print $1}')
          {
            echo "source_sha=$source_sha"
            echo "manifest_sha=$manifest_sha"
            echo "component_versions_sha=$component_versions_sha"
            echo "agent_core_version=$AGENT_CORE_VERSION"
            echo "knowledge_connector_version=$KNOWLEDGE_CONNECTOR_VERSION"
            echo "h_lite_version=$H_LITE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Write verification manifest
        shell: bash
        env:
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
          IMAGE_PLATFORM: ${{ steps.image.outputs.platform }}
          IMAGE_ARCHIVE_SHA: ${{ steps.image.outputs.archive_sha }}
          SOURCE_ARCHIVE_SHA: ${{ steps.release.outputs.source_sha }}
          RELEASE_MANIFEST_SHA: ${{ steps.release.outputs.manifest_sha }}
          H_LITE_SOURCE_COMMIT: ${{ steps.hlite.outputs.source_commit }}
          H_LITE_SOURCE_ARCHIVE_SHA: ${{ steps.hlite.outputs.archive_sha }}
          RUNTIME_COMPONENT_VERSIONS_SHA: ${{ steps.release.outputs.component_versions_sha }}
          AGENT_CORE_VERSION: ${{ steps.release.outputs.agent_core_version }}
          KNOWLEDGE_CONNECTOR_VERSION: ${{ steps.release.outputs.knowledge_connector_version }}
          H_LITE_VERSION: ${{ steps.release.outputs.h_lite_version }}
          POSTGRES_IMAGE: pgvector/pgvector:pg17-bookworm@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
          DOMAIN_PERSISTENCE: ${{ steps.postgres.outputs.domain_persistence }}
          DOMAIN_PERSISTENCE_IDEMPOTENT: ${{ steps.postgres.outputs.domain_persistence_idempotent }}
          ACL_FAIL_CLOSED: ${{ steps.postgres.outputs.acl_fail_closed }}
          GOAL7_FOUNDATION: ${{ steps.goal7.outputs.authority_runtime_foundation }}
          ROUTE_B_STATE: ${{ steps.goal7.outputs.route_b }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const sha256File = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')
          const manifest = {
            evidenceVersion: '1.0.0',
            verificationType: 'P1-SI-F-linux-amd64-runtime',
            sourceCommit: process.env.GITHUB_SHA,
            hLiteSourceCommit: process.env.H_LITE_SOURCE_COMMIT,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            runner: 'ubuntu-24.04',
            collectorImageId: process.env.IMAGE_ID,
            collectorPlatform: process.env.IMAGE_PLATFORM,
            collectorImageArchiveSha256: process.env.IMAGE_ARCHIVE_SHA,
            sourceArchiveSha256: process.env.SOURCE_ARCHIVE_SHA,
            hLiteSourceArchiveSha256: process.env.H_LITE_SOURCE_ARCHIVE_SHA,
            runtimeComponentVersionsSha256: process.env.RUNTIME_COMPONENT_VERSIONS_SHA,
            agentCoreVersion: process.env.AGENT_CORE_VERSION,
            knowledgeConnectorVersion: process.env.KNOWLEDGE_CONNECTOR_VERSION,
            hLiteVersion: process.env.H_LITE_VERSION,
            releaseManifestSha256: process.env.RELEASE_MANIFEST_SHA,
            postgresImage: process.env.POSTGRES_IMAGE,
            imageBuildVerified: true,
            sqlRuntimeVerified: true,
            domainPersistence: process.env.DOMAIN_PERSISTENCE,
            domainPersistenceIdempotent: process.env.DOMAIN_PERSISTENCE_IDEMPOTENT,
            aclFailClosed: process.env.ACL_FAIL_CLOSED,
            goal7AuthorityRuntimeFoundation: process.env.GOAL7_FOUNDATION,
            goal7FoundationEvidenceSha256: sha256File('runtime-evidence/goal7-foundation-validation.txt'),
            postgresEvidenceSha256: sha256File('runtime-evidence/postgres-validation.txt'),
            routeBState: process.env.ROUTE_B_STATE,
            immutableReleaseCandidateVerified: true,
            companyQnapDeployed: false,
            publish: false,
          }
          fs.writeFileSync('runtime-evidence/runtime-verification.json', `${JSON.stringify(manifest, null, 2)}\n`, { mode: 0o600 })
          NODE
          (
            cd runtime-evidence
            sha256sum \
              runtime-verification.json \
              postgres-validation.txt \
              goal7-foundation-validation.txt \
              release-manifest.json \
              runtime-component-versions.json \
              source.tar.gz \
              h-lite-source.tar.gz \
              collector-image.tar.gz \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload runtime evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p1-si-runtime-${{ github.sha }}
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 90
