# rust-worker Ubuntu 24.04 兼容构建(64.90 生产机 glibc 2.39 对齐)
# 触发:workflow_dispatch --ref feat/rust-worker;产物:release 二进制 artifact。
# 为什么在 CI 建:dev198 是 26.04/glibc 2.43,产物带 GLIBC_2.43 符号跑不了 24.04;
# 本地无 docker/lxd,GH runner 的 ubuntu-24.04 就是目标环境本身。
name: rust-worker-2404
on:
  workflow_dispatch: {}
# contents: write 仅为 release 上传产物(2026-08-20:actions artifact 配额被历史产物打满,
# 删除后重算要 6-12h+,四连撞墙后改走 release asset——不占 artifact 配额,永不再撞)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: 2-Projects/realtime-voice-agent/rust-worker
    steps:
      - uses: actions/checkout@v4
      - name: system deps (webrtc-sys 构建需 glib 头)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-dev pkg-config
      - name: toolchain
        run: rustc -V && cargo -V
      - name: regression tests
        run: cargo test --locked
      - name: build release with ABI gates
        run: bash scripts/build-local.sh
      - name: routing preview
        run: |
          cargo test --locked --manifest-path tools/search-route-preview/Cargo.toml
          cargo build --release --locked --manifest-path tools/search-route-preview/Cargo.toml
          sha256sum target/release/voice-rust-worker tools/search-route-preview/target/release/search-route-preview > style-ark-sha256.txt
      - name: glibc symbol ceiling (must be <= 2.39)
        run: |
          syms=$(objdump -T target/release/voice-rust-worker | grep -o 'GLIBC_2\.[0-9]*' | sort -t. -k2 -n -u)
          echo "$syms"
          echo "$syms" | awk -F. '$2 > 39 { print "TOO NEW: " $0; bad = 1 } END { exit bad }'
      - name: publish binary as release asset (artifact 配额绕道)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f target/release/voice-rust-worker
          tag="rust-worker-build-${{ github.run_id }}"
          gh release create "$tag" --title "$tag" \
            --notes "voice-rust-worker ubuntu-24.04 (run ${{ github.run_id }}, sha ${{ github.sha }})" \
            --target "${{ github.sha }}"
          gh release upload "$tag" target/release/voice-rust-worker tools/search-route-preview/target/release/search-route-preview style-ark-sha256.txt
          echo "release=$tag"
